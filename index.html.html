/* ---------- Fokus-Rauschen (Web Audio, offline) ---------- */

function toggleNoise(){
  if (noiseSource) {
    noiseSource.stop();
    noiseSource = null;
    const label = $("#noiseLabel");
    if (label) label.textContent = "Fokus-Rauschen starten";
    return;
  }

  try {
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === "suspended") audioContext.resume();

    const buffer = audioContext.createBuffer(1,audioContext.sampleRate * 2,audioContext.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * .18;

    noiseSource = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    gain.gain.value = .12;
    noiseSource.buffer = buffer;
    noiseSource.loop = true;
    noiseSource.connect(gain).connect(audioContext.destination);
    noiseSource.start();

    const label = $("#noiseLabel");
    if (label) label.textContent = "Rauschen stoppen";
  } catch (error) {
    toast("Audio konnte nicht gestartet werden.");
  }
}

/* ---------- Aufgaben-Timer: Schritt für Schritt ---------- */

/*
 * Ablauf:
 * 1. Offene Schritte einer Aufgabe werden der Reihe nach gelesen.
 * 2. Jeder Schritt läuft mit seiner eigenen Minutenzahl.
 * 3. Am Ende erscheint ein Hinweis mit drei Auswahlen:
 *    Erledigt und weiter · Noch 3 Minuten · Schritt wiederholen
 * 4. Die Endzeit wird gespeichert, damit der Timer nach dem Neuladen weiterläuft.
 */

function startTaskSequence(taskId){
  const t = taskById(taskId);
  if (!t) return;

  const steps = (t.subtasks || [])
    .filter(s => !s.done)
    .sort((a,b) =>
      String(a.date || t.due).localeCompare(String(b.date || t.due)) ||
      (Number(a.phase) || 0) - (Number(b.phase) || 0)
    );

  if (!steps.length) {
    toast("Diese Aufgabe hat keine offenen Schritte.");
    return;
  }

  if (timer.running) {
    if (!confirm("Ein Timer läuft gerade. Ihn beenden und die Schrittfolge starten?")) return;
    finishTimer(true);
  }

  state.meta.sequence = {
    taskId,
    title:t.title,
    stepIds:steps.map(s => s.id),
    index:0,
    startedAt:new Date().toISOString(),
    completed:[],
    skipped:[],
    stepEnd:0,
    paused:false,
    pausedRemaining:0,
    phase:"running"
  };

  save();
  startSequenceStep();
  goTo("focus");
}

function currentSequenceStep(seq = state.meta.sequence){
  if (!seq) return null;
  const t = taskById(seq.taskId);
  if (!t) return null;
  const id = seq.stepIds[seq.index];
  const step = (t.subtasks || []).find(s => s.id === id);
  return step ? {task:t,step} : null;
}

function startSequenceStep(){
  const seq = state.meta.sequence;
  if (!seq) return;

  const current = currentSequenceStep(seq);
  if (!current) {
    finishSequence();
    return;
  }

  const minutes = clamp(Number(current.step.duration) || 10,1,600);
  seq.stepEnd = Date.now() + minutes * 60000;
  seq.phase = "running";

  timer.mode = "focus";
  timer.goal = `${current.task.title}: ${current.step.title}`;
  timer.original = minutes * 60;
  timer.remaining = timer.original;
  timer.running = true;
  timer.end = seq.stepEnd;
  timer.distractions = 0;

  persistTimer();
  startTimerInterval();
  saveSequenceQuietly();
}

function saveSequenceQuietly(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

function sequenceRemaining(seq){
  if (seq.phase !== "running") return seq.pausedRemaining || 0;
  return Math.max(0,Math.ceil((seq.stepEnd - Date.now()) / 1000));
}

/* Wird über den Timer-Intervall aufgerufen, wenn ein Schritt endet */
function onSequenceStepEnd(){
  const seq = state.meta.sequence;
  if (!seq || seq.phase !== "running") return;

  seq.phase = "asking";
  beep(3);
  vibrate([250,120,250,120,250]);

  if (document.hidden && "Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("Schritt geschafft?",{
        body:"Dein Lernschritt ist abgelaufen. Wähle, wie es weitergeht.",
        tag:"fokus-step"
      });
    } catch (e) {}
  }

  saveSequenceQuietly();
  showSequenceAlert();
}

function showSequenceAlert(){
  const current = currentSequenceStep();
  if (!current) return;

  const old = $("#seqAlert");
  if (old) old.remove();

  const el = document.createElement("div");
  el.id = "seqAlert";
  el.className = "seq-alert";
  el.setAttribute("role","alertdialog");
  el.innerHTML = `
    <h3>⏰ Zeit für diesen Schritt ist um</h3>
    <div class="small muted">${esc(current.step.title)}</div>
    <div class="btn-row">
      <button class="btn success" onclick="sequenceAnswer('done')">✓ Erledigt, weiter</button>
      <button class="btn" onclick="sequenceAnswer('more',3)">+3 Min. noch</button>
      <button class="btn" onclick="sequenceAnswer('more',1)">+1 Min. noch</button>
      <button class="btn ghost" onclick="sequenceAnswer('repeat')">Wiederholen</button>
      <button class="btn ghost" onclick="sequenceAnswer('skip')">Überspringen</button>
    </div>`;
  document.body.appendChild(el);
}

function removeSequenceAlert(){
  $("#seqAlert")?.remove();
}

function sequenceAnswer(action,minutes = 0){
  const seq = state.meta.sequence;
  if (!seq) return;

  const current = currentSequenceStep();
  removeSequenceAlert();

  if (action === "done") {
    if (current) {
      toggleSubtaskSilently(current.task.id,current.step.id,true);
      seq.completed.push(current.step.id);
    }
    seq.index++;
  }

  if (action === "more") {
    seq.stepEnd = Date.now() + minutes * 60000;
    seq.phase = "running";
    timer.original = minutes * 60;
    timer.remaining = timer.original;
    timer.running = true;
    timer.end = seq.stepEnd;
    persistTimer();
    startTimerInterval();
    saveSequenceQuietly();
    renderFocus();
    return;
  }

  if (action === "repeat") {
    seq.phase = "running";
    startSequenceStep();
    renderFocus();
    return;
  }

  if (action === "skip") {
    if (current) seq.skipped.push(current.step.id);
    seq.index++;
  }

  if (seq.index >= seq.stepIds.length) {
    finishSequence();
    return;
  }

  startSequenceStep();
  renderFocus();
}

function toggleSubtaskSilently(taskId,stepId,done){
  const t = taskById(taskId);
  const st = t?.subtasks?.find(s => s.id === stepId);
  if (!st) return;
  st.done = done;
  st.doneAt = done ? new Date().toISOString() : null;
  if (done) addXP(6);
  save();
}

function pauseSequence(){
  const seq = state.meta.sequence;
  if (!seq || seq.phase !== "running") return;
  seq.pausedRemaining = sequenceRemaining(seq);
  seq.phase = "paused";
  timer.running = false;
  clearInterval(focusInterval);
  saveSequenceQuietly();
  renderFocus();
}

function resumeSequence(){
  const seq = state.meta.sequence;
  if (!seq || seq.phase !== "paused") return;
  seq.stepEnd = Date.now() + seq.pausedRemaining * 1000;
  seq.phase = "running";
  timer.running = true;
  timer.end = seq.stepEnd;
  persistTimer();
  startTimerInterval();
  saveSequenceQuietly();
  renderFocus();
}

function stopSequence(){
  if (!confirm("Schrittfolge abbrechen? Erledigte Schritte bleiben gespeichert.")) return;
  clearInterval(focusInterval);
  timer.running = false;
  timer.remaining = timer.original;
  state.meta.sequence = null;
  removeSequenceAlert();
  persistTimer();
  renderFocus();
}

function finishSequence(){
  const seq = state.meta.sequence;
  clearInterval(focusInterval);
  timer.running = false;
  state.meta.activeTimer = null;

  if (seq) {
    const t = taskById(seq.taskId);
    const total = seq.stepIds.length;
    const done = seq.completed.length;
    const minutes = seq.completed.reduce((sum,id) => {
      const st = t?.subtasks?.find(s => s.id === id);
      return sum + (Number(st?.duration) || 0);
    },0);

    if (minutes > 0) {
      state.sessions.push({
        id:uid(),
        date:iso(),
        minutes,
        goal:`${seq.title} (Schrittfolge)`,
        noPhone:false,
        distractions:0,
        mode:"sequence",
        hour:new Date().getHours(),
        createdAt:new Date().toISOString()
      });
    }

    seq.summary = {done,total,skipped:seq.skipped.length,minutes};
    state.meta.lastSequenceSummary = {...seq.summary,title:seq.title,date:iso()};
    addXP(Math.max(10,done * 4));
    confetti();
  }

  state.meta.sequence = null;
  save();
  removeSequenceAlert();
  renderFocus();

  const s = state.meta.lastSequenceSummary;
  if (s) {
    toast(`Fertig: ${s.done} von ${s.total} Schritten erledigt.`);
  }
}

function sequenceBannerHTML(seq){
  const t = taskById(seq.taskId);
  const total = seq.stepIds.length;
  const current = seq.index;

        <button class="btn ghost" onclick="sequenceAnswer('skip')">Überspringen</button>
        <button class="btn danger" onclick="stopSequence()">Abbrechen</button>

/* Zusätzlicher Update-Lauf für die Schrittfolge, unabhängig vom normalen Timer */

const POINT_OPTIONS = Array.from({length:16},(_,i) => 15 - i);

function writtenRatio(){
  return clamp(Number(state.settings.writtenWeight) || 60,0,100) / 100;
}

function avgPoints(list){
  const nums = list.map(Number).filter(n => Number.isFinite(n));
  return nums.length ? nums.reduce((a,b) => a + b,0) / nums.length : null;
}

/* Schriftlich und mündlich werden getrennt gemittelt und dann gewichtet. */
function subjectGradeInfo(subjectId){
  const grades = state.grades.filter(g => g.subjectId === subjectId);
  const written = avgPoints(grades.filter(g => g.kind === "written").map(g => g.points));
  const oral = avgPoints(grades.filter(g => g.kind === "oral").map(g => g.points));
  const w = writtenRatio();

  let avg;
  if (written !== null && oral !== null) avg = written * w + oral * (1 - w);
  else avg = written ?? oral;

  return {avg, written, oral, count:grades.length};
}

function overallAverage(){
  const values = state.subjects
    .map(s => subjectGradeInfo(s.id).avg)
    .filter(v => v !== null);
  return avgPoints(values);
}

function gradeDisplay(points){
  const p = roundPoints(points);
  return state.settings.gradeScale === "classic" ? pointsLabel(p) : `${p} P`;

function averageDisplay(avg){
  if (avg === null || avg === undefined) return "–";
  if (state.settings.gradeScale === "classic") {
    return `≈ ${fmt(pointsToClassic(avg),2)}`;

  return `${fmt(avg,2)} P`;
}

  state.settings.gradeScale = value === "classic" ? "classic" : "points";

/*
 * Berechnet, welche Punktzahl die nächste Note mindestens braucht.
 * Gewichtung: Ist eine Art (schriftlich/mündlich) noch leer, zählt nur die andere.
 */
function computeNeededPoints(subjectId,kind,targetPoints){
  const grades = state.grades.filter(g => g.subjectId === subjectId);
  const same = grades.filter(g => g.kind === kind).map(g => Number(g.points));
  const other = grades.filter(g => g.kind !== kind).map(g => Number(g.points));

  const wKind = kind === "written" ? writtenRatio() : 1 - writtenRatio();
  const wOther = 1 - wKind;

  if (wKind <= 0) return {ignored:true};

  const otherAvg = avgPoints(other);
  const n = same.length;
  const sum = same.reduce((a,b) => a + b,0);

  let neededKindAvg = targetPoints;
  if (otherAvg !== null && wOther > 0) {
    neededKindAvg = (targetPoints - otherAvg * wOther) / wKind;
  }

  const needed = neededKindAvg * (n + 1) - sum;
  return {needed};
}

function calculateGradeTarget(){
  const subjectId = $("#targetSubject")?.value;
  const kind = $("#targetKind")?.value || "written";
  const target = clamp(Number($("#targetPoints")?.value) || 0,0,15);
  const result = $("#targetResult");
  if (!result || !subjectId) return;

  const r = computeNeededPoints(subjectId,kind,target);
  result.classList.remove("hidden");

  if (r.ignored) {
    result.innerHTML = "Diese Art von Note hat bei deiner Gewichtung keinen Einfluss auf den Schnitt.";
    return;
  }

  const points = Math.ceil(r.needed - 1e-9);

  if (points > 15) {
    result.innerHTML = `<strong>Mit einer einzelnen Note nicht erreichbar.</strong><br>
      Der Zielschnitt ${fmt(target,1)} P ist mit dieser Art von Note nicht mehr zu schaffen.
      Passe das Ziel an oder plane eine weitere Note ein.`;
  } else if (points <= 0) {
    result.innerHTML = `<strong>Ziel bereits abgesichert.</strong><br>
      Jede Punktzahl reicht, damit dein Schnitt den Zielwert erreicht.`;
  } else {
    result.innerHTML = `Du brauchst mindestens <strong>${points} Punkte</strong>
      (${pointsLabel(points)}), damit dein Schnitt ${fmt(target,1)} P erreicht.`;
  }
}

/* Schwankung der Schlafdauer: je kleiner, desto regelmäßiger */
function sleepVariation(){
  const hours = lastDaysHealth(7)
    .map(d => Number(d.sleepHours))
    .filter(h => h > 0);

  if (hours.length < 3) return null;

  const avg = hours.reduce((a,b) => a + b,0) / hours.length;
  const sd = Math.sqrt(hours.reduce((s,h) => s + (h - avg) ** 2,0) / hours.length);
  return {avg,sd,count:hours.length};
}

function weekStats(key){
  const days = Array.from({length:7},(_,i) => addDays(key,i));
  const focus = days.map(d => focusMinutes(d));

  const reviews = state.reviews.filter(r => days.includes(r.date)).length;

  const doneTasks = state.tasks.filter(t =>
    t.completedAt && days.includes(t.completedAt.slice(0,10))
  ).length;

  const doneSteps = state.tasks.reduce((sum,t) =>
    sum + (t.subtasks || []).filter(s =>
      s.doneAt && days.includes(s.doneAt.slice(0,10))
    ).length,0);

  const gym = days.filter(d => state.checkins[d]?.gym).length;

  return {
    days,
    focus,
    focusTotal:focus.reduce((a,b) => a + b,0),
    reviews,
    doneTasks,
    doneSteps,
    gym
  };
}

/* ---------- Daten: Export, Import, Kalender, Reset ---------- */

function exportData(){
  state.meta.lastBackup = iso();
  save();
  download(`fokus-sicherung-${iso()}.json`,JSON.stringify(state,null,2),"application/json");
  toast("Sicherung erstellt.");
}

function handleImport(file){
  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);

      if (data.type === "fokus-cards" && Array.isArray(data.cards)) {
        data.cards.forEach(c => state.cards.push({...c,id:uid()}));
        save();
        render();
        toast(`${data.cards.length} Karten importiert.`);
        return;
      }

      if (!data.version || !Array.isArray(data.tasks)) {
        throw new Error("Unbekanntes Format");
      }

      if (!confirm("Die aktuellen Daten durch die Sicherung ersetzen?")) return;

      localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
      clearInterval(focusInterval);
      state = loadState();
      migrateState();
      ensureTimerState();
      timer.running = false;
      restoreTimer();
      save();
      render();
      toast("Sicherung importiert.");
    } catch (error) {
      alert("Die Datei konnte nicht gelesen werden.");
    }
  };

  reader.readAsText(file);
}

/* Die Import-Schaltfläche in der HTML-Datei aktivieren */
$("#importFile").addEventListener("change",e => {
  const file = e.target.files[0];
  if (file) handleImport(file);
  e.target.value = "";
});

function icsEscape(value){
  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll(",","\\,")
    .replaceAll(";","\\;")
    .replace(/\r?\n/g,"\\n");
}

function exportCalendar(){
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Fokus Lern-App//DE",
    "CALSCALE:GREGORIAN"
  ];

  state.tasks.filter(t => !t.completed).forEach(t => {
    const start = String(t.due).replaceAll("-","");
    const end = addDays(t.due,1).replaceAll("-","");

    lines.push(
      "BEGIN:VEVENT",
      `UID:${t.id}@fokus`,
      `DTSTART;VALUE=DATE:${start}`,
      `DTEND;VALUE=DATE:${end}`,
      `SUMMARY:${icsEscape(`${typeLabel(t.type)}: ${t.title}`)}`,
      `DESCRIPTION:${icsEscape(`${taskSubjectLabel(t)}${t.notes ? " – " + t.notes : ""}`)}`,
      "END:VEVENT"
    );
  });

  lines.push("END:VCALENDAR");
  download(`fokus-kalender-${iso()}.ics`,lines.join("\r\n"),"text/calendar");
}

function loadDemoData(){
  if (!confirm("Beispieldaten ergänzen?")) return;

function resetApp(){
  if (!confirm("Wirklich alle Daten löschen?")) return;
  if (!confirm("Letzte Sicherheitsfrage: Ohne Export ist nichts wiederherstellbar.")) return;

  localStorage.removeItem(STORAGE_KEY);

}

/* ---------- Tagesbriefing ---------- */

function todayBriefing(){
  const actions = nextActions();
  const today = iso();
  const dueToday = actions.filter(a => a.date <= today);
  const minutes = dueToday.reduce((sum,a) => {
    const task = taskById(a.taskId);
    if (!task) return sum;
    if (a.stepId) {
      const st = (task.subtasks || []).find(s => s.id === a.stepId);
      return sum + (Number(st?.duration) || 0);
    }
    return sum + (Number(task.duration) || 0);
  },0);

  return {actions,dueToday,minutes};
}

/* ---------- Haupt-Render und Navigation ---------- */

function render(){
  if (currentView === "today") renderToday();
  else if (currentView === "plan") renderPlan();
  else if (currentView === "learn") renderLearn();
  else if (currentView === "focus") renderFocus();
  else if (currentView === "more") renderMore();

  $$(".nav-btn").forEach(b => b.classList.toggle("active",b.dataset.view === currentView));
}

function goTo(view){
  currentView = view;
  document.body.classList.remove("focus-mode");
  render();
  window.scrollTo({top:0,behavior:state.settings.reduceMotion ? "auto" : "smooth"});
}

function startTwoMinutes(){
  if (timer.running) {
    toast("Ein Timer läuft gerade. Beende ihn zuerst.");
    goTo("focus");
    return;
  }
  timer.original = 120;
  timer.remaining = 120;
  timer.goal = "Nur zwei Minuten anfangen";
  timer.mode = "focus";
  goTo("focus");
}

function toggleTheme(){
  const actual = document.documentElement.dataset.theme;
  state.settings.theme = actual === "dark" ? "light" : "dark";
  save();
  render();
}

/* Schaltflächen der unteren Navigation */
$$(".nav-btn").forEach(button => {
  button.addEventListener("click",() => goTo(button.dataset.view));
});

/* System-Helligkeit beachten, wenn „Automatisch“ gewählt ist */
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",() => {
  if (state.settings.theme === "auto") {
    applySettings();
    render();
  }
});

/* ---------- Sichere Formatierung (ohne HTML-Ausführung) ---------- */

/*
 * Der Text wird zuerst vollständig escaped. Erst danach werden Markdown-Zeichen
 * in HTML umgewandelt. So kann eine KI-Antwort keinen aktiven Code einschleusen.
 */
function mdInline(text){
  return String(text ?? "")
    .split(/(`[^`]+`)/g)
    .map((part,index) => {
      if (index % 2 === 1) {
        return `<code>${esc(part.slice(1,-1))}</code>`;
      }
      let t = esc(part);
      t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        (_,label,url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
      t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
      t = t.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
      return t;
    })
    .join("");
}

function splitTableRow(line){
  return line.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c => c.trim());
}

function markdownToHTML(source){
  const lines = String(source ?? "").replace(/\r\n?/g,"\n").split("\n");
  const out = [];
  let para = [];
  let i = 0;

  const flush = () => {
    if (para.length) {
      out.push(`<p>${para.map(mdInline).join("<br>")}</p>`);
      para = [];
    }
  };

  const ulRe = /^\s*[-*+]\s+(.*)$/;
  const olRe = /^\s*\d+[.)]\s+(.*)$/;

  while (i < lines.length) {
    const line = lines[i];

    /* Codeblöcke */
    if (/^\s*```/.test(line)) {
      flush();
      const code = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) {
        code.push(lines[i]);
        i++;
      }
      i++;
      out.push(`<pre class="md-code"><code>${esc(code.join("\n"))}</code></pre>`);
      continue;
    }

    /* Tabellen */
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      flush();
      const head = splitTableRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        rows.push(splitTableRow(lines[i]));
        i++;
      }
      out.push(`<div class="md-table"><table>
        <thead><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>`);
      continue;
    }

    /* Überschriften */
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      flush();
      const level = Math.min(6,heading[1].length + 2);
      out.push(`<h${level}>${mdInline(heading[2])}</h${level}>`);
      i++;
      continue;
    }

    /* Trennlinie */
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flush();
      out.push("<hr>");
      i++;
      continue;
    }

    /* Zitate */
    if (/^\s*>/.test(line)) {
      flush();
      const quote = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        quote.push(lines[i].replace(/^\s*>\s?/,""));
        i++;
      }
      out.push(`<blockquote>${quote.map(mdInline).join("<br>")}</blockquote>`);
      continue;
    }

    /* Listen */
    if (ulRe.test(line) || olRe.test(line)) {
      flush();
      const re = ulRe.test(line) ? ulRe : olRe;
      const tag = re === ulRe ? "ul" : "ol";
      const items = [];
      while (i < lines.length && re.test(lines[i])) {
        items.push(lines[i].match(re)[1]);
        i++;
      }
      out.push(`<${tag}>${items.map(x => `<li>${mdInline(x)}</li>`).join("")}</${tag}>`);
      continue;
    }

    /* Leerzeile beendet einen Absatz */
    if (!line.trim()) {
      flush();
      i++;
      continue;
    }

    para.push(line);
    i++;
  }

  flush();
  return out.join("");
}

/* ---------- Anhänge ---------- */

function guessType(name){
  const n = String(name || "").toLowerCase();
  if (/\.jpe?g$/.test(n)) return "image/jpeg";
  if (n.endsWith(".png")) return "image/png";
  if (n.endsWith(".webp")) return "image/webp";
  if (n.endsWith(".pdf")) return "application/pdf";
  if (/\.(txt|md|csv)$/.test(n)) return "text/plain";
  if (n.endsWith(".json")) return "application/json";
  return "";
}

function fileSizeText(bytes){
  return bytes > 1024 * 1024
    ? `${(bytes / 1024 / 1024).toFixed(1)} MB`
    : `${Math.max(1,Math.round(bytes / 1024))} KB`;
}

function readAsDataURL(file){
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Datei konnte nicht gelesen werden"));
    reader.readAsDataURL(file);
  });
}

/* Bilder verkleinern, damit Anfragen klein bleiben und das Handy nicht überlastet */
function compressImage(file){
  return new Promise((resolve,reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      const scale = Math.min(1,COACH_LIMITS.imageMax / Math.max(img.width,img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg",.85));
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Das Bild konnte nicht gelesen werden"));
    };

    img.src = url;
  });
}

async function readAttachment(file){
  const type = file.type || guessType(file.name);
  const id = uid();

  if (type.startsWith("image/")) {
    const dataUrl = await compressImage(file);
    return {id,name:file.name,type:"image/jpeg",size:Math.round(dataUrl.length * .75),dataUrl,kind:"image"};
  }

  if (type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    if (file.size > COACH_LIMITS.pdfBytes) throw new Error("PDF ist größer als 8 MB");
    const dataUrl = await readAsDataURL(file);
    return {id,name:file.name,type:"application/pdf",size:file.size,dataUrl,kind:"pdf"};
  }

  if (/^text\//.test(type) || /json/.test(type) || /\.(txt|md|csv|json)$/i.test(file.name)) {
    if (file.size > COACH_LIMITS.textBytes) throw new Error("Textdatei ist größer als 2 MB");
    const text = (await file.text()).slice(0,COACH_LIMITS.textChars);
    return {id,name:file.name,type:"text/plain",size:file.size,text,kind:"text"};
  }

  throw new Error("Dieser Dateityp wird nicht unterstützt");
}

async function handleCoachFiles(fileList){
  const files = [...(fileList || [])];
  if (!files.length) return;

  if (coachAttachments.length + files.length > COACH_LIMITS.files) {
    toast(`Maximal ${COACH_LIMITS.files} Anhänge pro Nachricht.`);
    return;
  }

  for (const file of files) {
    try {
      const att = await readAttachment(file);
      const total = coachAttachments.reduce((sum,a) => sum + a.size,0) + att.size;
      if (total > COACH_LIMITS.totalBytes) {
        toast("Die Anhänge sind zusammen zu groß. Entferne einen Anhang.");
        break;
      }
      coachAttachments.push(att);
    } catch (error) {
      toast(`„${file.name}“: ${error.message}`);
    }
  }

  renderAICoach();
}

function removeCoachAttachment(id){
  coachAttachments = coachAttachments.filter(a => a.id !== id);

}

/* Baut den Inhalt der letzten Nachricht, abhängig vom Anbieter-Typ */
function buildUserContent(text,attachments,mode){

    .filter(a => a.kind === "text")
    .forEach(a => textParts.push(`--- Datei: ${a.name} ---\n${a.text}`));

  const fullText = textParts.join("\n\n");

  if (mode === "proxy") {
    return {content:fullText};
  }

  const images = attachments.filter(a => a.kind === "image");
  const pdfs = attachments.filter(a => a.kind === "pdf");

  if (mode === "ollama") {
    return {
      content:fullText,
      images:images.map(a => a.dataUrl.split(",")[1])
    };
  }

  if (!images.length && !pdfs.length) return {content:fullText};

  const parts = [{type:"text",text:fullText}];
  images.forEach(a => parts.push({type:"image_url",image_url:{url:a.dataUrl}}));
  if (mode === "openai") {
    pdfs.forEach(a => parts.push({type:"file",file:{filename:a.name,file_data:a.dataUrl}}));
  }
  return {content:parts};
}

function buildChatMessages(history,attachments,mode){
  const msgs = history
    .filter(m => ["user","assistant"].includes(m.role))
    .slice(-16)
    .map(m => ({role:m.role,content:String(m.content || "").slice(0,7000)}));

  if (attachments.length && msgs.length) {
    const last = msgs[msgs.length - 1];
    Object.assign(last,buildUserContent(last.content,attachments,mode));
  }

  return msgs;
}

async function requestAIText(history,options = {}){
  const {examId = "",attachments = [],signal = null,timeoutMs = 60000} = options;

  if (!aiReady()) {
    throw new Error("Der KI-Dienst ist noch nicht eingerichtet.");
  }

  const mode = state.ai.mode;
  const context = buildAIContext(examId);
  const msgs = buildChatMessages(history,attachments,mode);

  const controller = new AbortController();
  if (signal) signal.addEventListener("abort",() => controller.abort());
  const timeout = setTimeout(() => controller.abort(),timeoutMs);

  try {
    let endpoint = state.ai.endpoint.trim();
    const headers = {"Content-Type":"application/json"};
    let payload;

    if (mode === "proxy") {
      payload = {
        model:state.ai.model || undefined,
        context,
        messages:msgs,
        attachments:attachments.map(a => ({
          name:a.name,
          type:a.type,
          kind:a.kind,
          dataUrl:a.dataUrl,
          text:a.text
        }))
      };
    } else if (mode === "ollama") {
      if (!/\/api\/chat\/?$/.test(endpoint)) {
        endpoint = endpoint.replace(/\/$/,"") + "/api/chat";
      }
      payload = {
        model:state.ai.model,
        stream:false,
        messages:[
          {role:"system",content:AI_SYSTEM_PROMPT},
          {role:"system",content:`PRÜFUNGSKONTEXT:\n${context}`},
          ...msgs
        ]
      };
    } else {
      if (!/chat\/completions\/?$/.test(endpoint)) {
        endpoint = endpoint.replace(/\/$/,"") + "/chat/completions";
      }
      headers.Authorization = `Bearer ${getAISecret()}`;
      payload = {
        model:state.ai.model,
        temperature:.2,
        messages:[
          {role:"system",content:AI_SYSTEM_PROMPT},
          {role:"system",content:`PRÜFUNGSKONTEXT:\n${context}`},
          ...msgs
        ]
      };
    }

    const response = await fetch(endpoint,{
      method:"POST",
      headers,
      body:JSON.stringify(payload),
      signal:controller.signal
    });

    const raw = await response.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      data = {answer:raw};
    }

    if (!response.ok) {
      throw new Error(data.error || `Der KI-Dienst antwortete mit HTTP ${response.status}.`);
    }

    const answer =
      data.answer ||
      data.message?.content ||
      data.choices?.[0]?.message?.content ||
      data.output_text;

    if (!answer) throw new Error("Der KI-Dienst hat keine lesbare Antwort geliefert.");

    return String(answer).trim();
  } catch (error) {
    if (error.name === "AbortError") {
      throw new Error("Die Anfrage wurde abgebrochen oder hat zu lange gedauert.");
    }
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}

function sendCoachMessage(){
  if (coachBusy) return;

  const input = $("#coachInput");
  const text = (input ? input.value : coachDraft).trim();

  if (!text && !coachAttachments.length) return;

  if (!aiReady()) {
    toast("Richte den KI-Dienst zuerst in den Einstellungen ein.");
    openAISettings();
    return;
  }

  if (coachAttachments.length && !state.ai.attachmentConsent) {
    const ok = confirm(
      "Anhänge werden an deinen eingerichteten KI-Dienst gesendet. " +
      "Bitte lade keine Namen, Adressen, Gesundheitsdaten oder andere vertrauliche Inhalte hoch. Fortfahren?"
    );
    if (!ok) return;
    state.ai.attachmentConsent = true;
  }

  const attachments = coachAttachments;
  coachAttachments = [];
  submitCoachText(text,attachments);
}

async function submitCoachText(text,attachments = []){
  if (coachBusy) return;

  if (!aiReady()) {
    toast("Richte den KI-Dienst zuerst in den Einstellungen ein.");
    openAISettings();
    return;
  }

  state.coachMessages.push({
    id:uid(),
    role:"user",
    content:text || "Bitte sieh dir die Anhänge an.",
    attachments:attachments.map(a => ({name:a.name,kind:a.kind,size:a.size})),
    createdAt:new Date().toISOString()
  });

  coachBusy = true;
  coachCancelled = false;
  coachController = new AbortController();
  coachDraft = "";
  save();
  renderAICoach();

  try {
    const answer = await requestAIText(state.coachMessages,{
      attachments,
      signal:coachController.signal,
      timeoutMs:attachments.length ? 90000 : 60000
    });

    state.coachMessages.push({
      id:uid(),
      role:"assistant",
      content:answer,
      createdAt:new Date().toISOString()
    });
  } catch (error) {
    if (coachCancelled) {
      state.coachMessages.push({
        id:uid(),
        role:"assistant",
        content:"Die Antwort wurde abgebrochen.",
        error:true,
        createdAt:new Date().toISOString()
      });
    } else {
      state.coachMessages.push({
        id:uid(),
        role:"assistant",
        content:`Das hat leider nicht geklappt: ${error.message}\n\nPrüfe Adresse, Modell, Zustimmung und deine Internetverbindung.`,
        error:true,
        createdAt:new Date().toISOString()
      });
    }
  } finally {
    coachBusy = false;
    coachController = null;
    coachCancelled = false;
    save();
    renderAICoach();
  }
}

/* ---------- KI-Themen aus der Stoffliste ---------- */

function parseAIJSON(text){
  const clean = String(text || "")
    .replace(/```json/gi,"")
    .replace(/```/g,"")
    .trim();

  try {
    return JSON.parse(clean);
  } catch {}

  const objStart = clean.indexOf("{");
  const arrStart = clean.indexOf("[");
  const start = objStart < 0 ? arrStart
    : arrStart < 0 ? objStart
    : Math.min(objStart,arrStart);

  if (start < 0) throw new Error("Die KI-Antwort enthielt kein JSON.");

  const end = clean[start] === "{"
    ? clean.lastIndexOf("}")
    : clean.lastIndexOf("]");

  if (end <= start) throw new Error("Die strukturierte Antwort war unvollständig.");

  return JSON.parse(clean.slice(start,end + 1));
}

async function generateAITopics(examId){
  const exam = taskById(examId);
  if (!exam || aiTopicBusy) return;

  const field = $("#examSyllabus");
  if (field) exam.syllabus = field.value.trim();

  if (!(exam.syllabus || "").trim()) {
    toast("Füge zuerst die Stoffliste ein.");
    return;
  }

  if (!aiReady()) {
    toast("Richte zuerst den KI-Dienst ein.");
    openAISettings();
    return;
  }

  aiTopicBusy = true;
  toast("KI ordnet die Stoffliste …");

  try {
    const answer = await requestAIText([{role:"user",content:TOPIC_PROMPT}],{examId});
    const parsed = parseAIJSON(answer);
    const list = Array.isArray(parsed) ? parsed : parsed.topics;

    if (!Array.isArray(list)) throw new Error("Keine Themenliste erhalten.");

    const topics = topicsOf(exam);
    const existing = new Set(topics.map(t => t.name.trim().toLowerCase()));
    let added = 0;

    list.slice(0,30).forEach(item => {
      const name = String(item.name || "").trim();
      if (!name || existing.has(name.toLowerCase())) return;

      topics.push(makeTopic({
        name,
        objective:String(item.objective || "").trim(),
        importance:clamp(Number(item.importance) || 3,1,5),
        confidence:1,
        minutes:clamp(Number(item.estimatedMinutes) || 30,10,300),
        source:"ai",
        confirmed:false
      }));

      existing.add(name.toLowerCase());
      added++;
    });

    save();
    renderExamCenter();
    toast(`${added} KI-Vorschläge. Bitte mit der Stoffliste prüfen und bestätigen.`);
  } catch (error) {
    toast(`KI-Themen konnten nicht erstellt werden: ${error.message}`);
  } finally {
    aiTopicBusy = false;
  }
}

/* ---------- KI-Karteikarten mit Prüfung vor dem Speichern ---------- */

async function generateAICards(examId,topicId){
  const exam = taskById(examId);
  const topic = topicsOf(exam || {}).find(t => t.id === topicId);
  if (!exam || !topic || aiTopicBusy) return;

  if (!aiReady()) {
    toast("Richte zuerst den KI-Dienst ein.");
    openAISettings();
    return;
  }

  const source = [exam.syllabus || "",topic.objective || "",topic.material || ""].join("\n").trim();
  if (source.length < 25) {
    toast("Ergänze zuerst ein Lernziel oder Material, damit die KI nichts erfinden muss.");
    return;
  }

  aiTopicBusy = true;
  toast("Karteikarten werden vorbereitet …");

  try {
    const answer = await requestAIText([{role:"user",content:cardPrompt(topic.name)}],{examId});
    const parsed = parseAIJSON(answer);
    const cards = Array.isArray(parsed) ? parsed : parsed.cards;

    if (!Array.isArray(cards) || !cards.length) {
      throw new Error("Aus dem vorhandenen Material konnten keine sicheren Karten entstehen.");
    }

    pendingAICards = cards.slice(0,5)
      .map(c => ({
        question:String(c.question || "").trim(),
        answer:String(c.answer || "").trim()
      }))
      .filter(c => c.question && c.answer);

    if (!pendingAICards.length) throw new Error("Die erzeugten Karten waren unvollständig.");

    openGeneratedCardsReview(examId,topicId);
  } catch (error) {
    toast(`Karten konnten nicht erstellt werden: ${error.message}`);
  } finally {
    aiTopicBusy = false;
  }
}

function openGeneratedCardsReview(examId,topicId){
  openSheet(`
    <div class="sheet-head">
      <div>
        <h2>KI-Karten prüfen</h2>
        <div class="small muted">Vergleiche jede Antwort mit deinen Unterlagen, bevor du speicherst.</div>
      </div>
      <button class="icon-btn" onclick="closeSheet()" aria-label="Schließen">✕</button>
    </div>

    <form onsubmit="acceptGeneratedCards(event,'${examId}','${topicId}')">
      ${pendingAICards.map((card,index) => `
        <div class="card pad" style="margin-bottom:12px">
          <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
            <input type="checkbox" name="use${index}" value="1" checked style="width:20px;min-height:20px">
            Diese Karte übernehmen
          </label>
          <label class="field">Frage
            <textarea name="q${index}" required>${esc(card.question)}</textarea>
          </label>
          <label class="field">Antwort
            <textarea name="a${index}" required>${esc(card.answer)}</textarea>
          </label>
        </div>`).join("")}
      <button class="btn primary wide">Geprüfte Karten speichern</button>
    </form>
  `);
}

function acceptGeneratedCards(event,examId,topicId){
  event.preventDefault();

  const exam = taskById(examId);
  if (!exam) return;

  const form = new FormData(event.target);
  let added = 0;

  pendingAICards.forEach((card,index) => {
    if (form.get(`use${index}`) !== "1") return;

    const question = String(form.get(`q${index}`) || "").trim();
    const answer = String(form.get(`a${index}`) || "").trim();
    if (!question || !answer) return;

    state.cards.push({
      id:uid(),
      subjectId:exam.subjectId,
      topicId,
      question,
      answer,
      type:"basic",
      source:"ai-reviewed",
      due:iso(),
      interval:0,
      ease:2.5,
      reps:0,
      createdAt:new Date().toISOString()
    });
    added++;
  });

  pendingAICards = [];
  addXP(added * 3);
  save();
  closeSheet();
  renderExamCenter();
  toast(`${added} geprüfte Karte(n) gespeichert.`);
}

function saveAISettings(event){

async function kiRun(ev,id){
  ev.preventDefault();
  const t=KI_TOOLS.find(x=>x.id===id), f=new FormData(ev.target);
  const v={sid:f.get("sid"),fach:subject(f.get("sid")).name,text:String(f.get("text")||"").slice(0,9000),x:String(f.get("x")||""),n:f.get("n")||5};

  if(!aiReady()){
    out.innerHTML=`<div class="ai-in"><p class="small muted">Kein KI-Dienst eingerichtet: Kopiere den Prompt in eine KI deiner Wahl und füge die Antwort unten ein.</p>

}

function kiItems(answer){
  let p; try{p=parseAIJSON(answer)}catch{p=null}
  const arr=Array.isArray(p)?p:(p&&(p.items||p.cards||p.questions));
  return Array.isArray(arr)?arr.map(c=>({question:String(c.question||c.q||c.frage||"").trim(),answer:String(c.answer||c.a||c.antwort||"").trim()})).filter(c=>c.question&&c.answer):[];
}

function kiHandle(id,answer,vRaw){
  const t=KI_TOOLS.find(x=>x.id===id), v=typeof vRaw==="string"?JSON.parse(vRaw):vRaw, out=$("#kiOut");
  if(!String(answer||"").trim()){toast("Keine Antwort vorhanden.");return;}
  if(t.out==="md"){
    out.innerHTML=`<div class="ai-in">${markdownToHTML(answer)}<button class="btn small ghost" onclick="navigator.clipboard?.writeText(${esc(JSON.stringify(JSON.stringify(answer)))}.slice(1,-1)).then(()=>toast('Kopiert.'))">Kopieren</button></div>`;
    return;
  }
  const items=kiItems(answer);
  if(!items.length){out.innerHTML=`<div class="empty">Das Ergebnis war kein gültiges JSON. Bitte erneut versuchen.</div>`;return;}
  if(t.out==="quiz") kiQuizStart(items,v); else kiReview(t.out,items,v.sid);
}

function kiSave(ev,kind){
  ev.preventDefault(); const f=new FormData(ev.target); let n=0;
  kiPending.forEach((_,i)=>{
    if(!f.get("u"+i)) return;
    const q=String(f.get("q"+i)).trim(), a=String(f.get("a"+i)).trim(); if(!q||!a) return;
    if(kind==="cards") state.cards.push({id:uid(),subjectId:f.get("sid"),topicId:"",question:q,answer:a,type:"basic",source:"ai-reviewed",due:iso(),interval:0,ease:2.5,reps:0,createdAt:new Date().toISOString()});
    else state.questions.push({id:uid(),subjectId:f.get("sid"),question:q,answer:a,createdAt:new Date().toISOString()});
    n++;
  });
  kiPending=[]; addXP(n*2); save(); closeSheet(); toast(`${n} Eintrag/Einträge gespeichert.`);
  if(learnTab==="ki") renderKITab();
}

let kiQ=null;
function kiQuizStart(items,v){kiQ={items,i:0,res:[],sid:v.sid};kiQuizShow();}
function kiQuizShow(){
  const out=$("#kiOut"), q=kiQ.items[kiQ.i];
  if(!q){ return kiQuizEnd(); }
  out.innerHTML=`<div class="ai-in"><div class="badge">Frage ${kiQ.i+1} / ${kiQ.items.length}</div><h3 style="margin:10px 0">${esc(q.question)}</h3>
    <textarea class="ki-pre" id="kiMine" placeholder="Deine Antwort"></textarea>
    <button class="btn" onclick="$('#kiSol').classList.remove('hidden');this.classList.add('hidden')">Lösung zeigen</button>
    <div id="kiSol" class="hidden"><div class="card pad" style="margin:10px 0"><b>Musterlösung</b><p>${esc(q.answer)}</p></div>
     <div class="btn-row"><button class="btn primary" onclick="kiRate(1)">✅ richtig</button><button class="btn" onclick="kiRate(.5)">🟡 teilweise</button><button class="btn danger" onclick="kiRate(0)">❌ falsch</button></div></div></div>`;
}
function kiRate(x){kiQ.res.push(x);kiQ.i++;kiQuizShow();}
function kiQuizEnd(){
  const pct=Math.round(kiQ.res.reduce((a,b)=>a+b,0)/kiQ.res.length*100), out=$("#kiOut"), wrong=kiQ.items.filter((_,i)=>kiQ.res[i]<1);
  out.innerHTML=`<div class="ai-in" style="text-align:center">${ring("Ergebnis",0,100,"0 %","var(--accent)")}
    <div class="ki-big" id="kiEmoji"></div><p>${pct>=80?"Stark! Das sitzt.":pct>=50?"Guter Anfang, wiederhole die Lücken.":"Kein Problem: genau dafür übst du."}</p>
    ${wrong.length?`<button class="btn primary" id="kiWrong">Falsche als Karten prüfen (${wrong.length})</button>`:""}</div>`;
  const rg=out.querySelector(".ring"), s=out.querySelector(".ring strong"); let n=0;
  const step=()=>{ n=Math.min(pct,n+Math.max(1,Math.round(pct/30))); rg.style.setProperty("--value",n+"%"); s.textContent=n+" %"; if(n<pct) requestAnimationFrame(step); };
  if(state.settings.reduceMotion||state.settings.calm){rg.style.setProperty("--value",pct+"%");s.textContent=pct+" %";} else step();
  $("#kiEmoji").textContent=pct>=80?"🏆":pct>=50?"💪":"🌱";
  if(pct>=80&&!state.settings.reduceMotion&&!state.settings.calm) confetti();
  const b=$("#kiWrong"); if(b) b.onclick=()=>kiReview("cards",wrong,kiQ.sid);
  addXP(Math.round(pct/20)); save();
}

/* ---------- Lernstand-Radar und Prognose ---------- */
function radarHTML(){
  const subs=state.subjects.slice(0,10); if(subs.length<3) return "";
  const R=100,C=130,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/subs.length;return [C+Math.cos(a)*r,C+Math.sin(a)*r];};
  const poly=f=>subs.map((s,i)=>pt(i,R*f(s)/100).map(n=>n.toFixed(1)).join(",")).join(" ");
  return `<section class="card pad ai-in" style="margin-top:16px"><div class="section-title"><h2>Lernstand-Radar</h2><span class="badge">gestrichelt = Ziel 70 %</span></div>
   <svg viewBox="0 0 260 260" style="width:100%;max-width:360px;display:block;margin:auto" role="img" aria-label="Radar des Lernstands pro Fach">
   ${[25,50,75,100].map(l=>`<polygon points="${poly(()=>l)}" fill="none" stroke="var(--border)"/>`).join("")}
   <polygon points="${poly(()=>70)}" fill="none" stroke="var(--accent-2)" stroke-dasharray="4 3"/>
   <polygon points="${poly(s=>subjectScore(s.id))}" fill="rgba(var(--accent-rgb),.25)" stroke="var(--accent)" stroke-width="2"/>
   ${subs.map((s,i)=>{const [x,y]=pt(i,R+16);return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="9" text-anchor="middle" fill="var(--text)">${esc(s.name.slice(0,9))}</text>`;}).join("")}</svg></section>`;
}
function forecastExam(e){
  const days=Math.max(0,daysBetween(iso(),e.due)), topics=confirmedTopics(e);
  const ready=Number(examReadiness(e))||0;
  const need=topics.reduce((a,t)=>a+(Number(t.minutes)||30)*(1-clamp(Number(topicReadiness(t))||0,0,100)/100),0)||Math.max(30,(100-ready)*1.2);
  const crowd=Math.max(1,examTasks().filter(x=>daysBetween(iso(),x.due)>=0&&daysBetween(iso(),x.due)<=14).length);
  const avail=days*dailyCapacity()*.5/crowd, proj=Math.round(ready+(100-ready)*Math.min(1,avail/Math.max(need,1)));
  return {exam:e,days,ready:Math.round(ready),proj,need:Math.round(need),avail:Math.round(avail)};
}
function forecastHTML(){
  const list=examTasks().filter(e=>daysBetween(iso(),e.due)>=0).slice(0,4).map(forecastExam);
  if(!list.length) return "";
  return `<section class="card pad ai-in" style="margin-top:16px"><div class="section-title"><h2>Prognose bis zum Termin</h2></div>${list.map(f=>`

function routinesForDate(date){
  const weekday = (parseISO(date).getDay() || 7); /* 1 = Montag */
  return state.routines
    .filter(r => r.days.includes(weekday) && (!r.from || date >= r.from))
    .sort((a,b) => String(a.time || "99").localeCompare(String(b.time || "99")));
}

function routineIsDone(id,date = iso()){
  return (state.routineDone[date] || []).includes(id);
}

function toggleRoutine(id,date = iso()){
  const list = state.routineDone[date] || [];
  const r = state.routines.find(x => x.id === id);
  const now = !list.includes(id);
  state.routineDone[date] = now ? [...list,id] : list.filter(x => x !== id);

  /* Gym-Routinen zählen automatisch für das Wochen-Training */
  if (r && r.category === "gym") {
    state.checkins[date] = {...(state.checkins[date] || {}),gym:now};
  }
  if (now) { addXP(4); vibrate(20); }
  save();
  render();
}

let ttPending = [];

const TT_PROMPT = `
Auf dem Bild ist ein Schulstundenplan. Lies ihn aus.
Antworte NUR als JSON in genau diesem Format, ohne Erklärung:
{"lessons":[{"day":1,"start":"08:00","end":"08:45","subject":"Mathematik","room":"212","teacher":"","week":"both"}]}
day: 1=Montag … 5=Freitag (6/7 nur falls vorhanden). Uhrzeiten als HH:MM, 24-Stunden.
Wenn nur Stundennummern stehen, nutze: 1=08:00-08:45, 2=08:50-09:35, 3=09:55-10:40, 4=10:45-11:30, 5=11:50-12:35, 6=12:40-13:25, 7=14:00-14:45, 8=14:50-15:35.
Doppelstunden als eine Zeile mit entsprechender Endzeit. week: "both", "A" oder "B".
Unleserliches auslassen, nichts erfinden.
`.trim();

function matchSubjectId(name){
  const n = String(name || "").toLowerCase().trim();
  if (!n) return "";
  const exact = state.subjects.find(s => s.name.toLowerCase() === n);
  if (exact) return exact.id;
  const aliases = {ma:"mathe",mathe:"mathe",m:"mathe",d:"deutsch",de:"deutsch",e:"englisch",en:"englisch",eng:"englisch",ge:"geschichte",g:"geschichte",bio:"bio",b:"bio",ph:"physik",phy:"physik",ch:"chemie",che:"chemie"};
  if (aliases[n] && state.subjects.some(s => s.id === aliases[n])) return aliases[n];
  const partial = state.subjects.find(s => s.name.toLowerCase().startsWith(n) || n.startsWith(s.name.toLowerCase().slice(0,4)));
  return partial ? partial.id : "";
}

async function importTimetablePhoto(file){
  if (!file) return;
  if (!aiReady()) {
    toast("Für das Auslesen eines Fotos muss der KI-Dienst eingerichtet sein (bildfähiges Modell).");
    openAISettings();
    return;
  }
  if (state.ai.mode === "proxy") {
    toast("Hinweis: Der alte Proxy leitet noch keine Bilder weiter. Nutze den direkten Modus oder den neuen Proxy.");
  }

  toast("Foto wird ausgelesen …");
  try {
    const att = await readAttachment(file);
    const answer = await requestAIText([{role:"user",content:TT_PROMPT}],{attachments:[att],timeoutMs:90000});
    const parsed = parseAIJSON(answer);
    const list = Array.isArray(parsed) ? parsed : parsed.lessons;
    if (!Array.isArray(list) || !list.length) throw new Error("Keine Stunden erkannt.");

    ttPending = list.slice(0,60).map(l => ({
      day:clamp(Number(l.day) || 1,1,7),
      start:String(l.start || "08:00").slice(0,5),
      end:String(l.end || "08:45").slice(0,5),
      subjectName:String(l.subject || "").trim(),
      subjectId:matchSubjectId(l.subject),
      room:String(l.room || "").trim(),
      teacher:String(l.teacher || "").trim(),
      week:["A","B"].includes(l.week) ? l.week : "both"
    }));
    openTimetableReview();
  } catch (error) {
    toast(`Auslesen fehlgeschlagen: ${error.message}`);
  }
}

function acceptTimetableReview(event){
  event.preventDefault();

    const subjectId = String(f.get(`subject${i}`) || "");
    if (!subjectId) return;
    state.timetable.push({
      id:uid(),

      subjectId,
      start:String(f.get(`start${i}`) || l.start),

function parseTimetableText(event){
  event.preventDefault();
  const text = String(new FormData(event.target).get("text") || "");
  const dayMap = {mo:1,di:2,mi:3,do:4,fr:5,sa:6,so:7,montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5};
  const out = [];

  text.split(/\n/).forEach(line => {
    const m = line.trim().match(/^([A-Za-zäö]+)\s+(\S+)\s+(.+?)(?:\s+(\S+))?$/);
    if (!m) return;
    const day = dayMap[m[1].toLowerCase()];
    if (!day) return;

    let start, end;
    const t = m[2];
    const timeMatch = t.match(/^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})$/);
    const slotMatch = t.match(/^(\d)(?:-(\d))?$/);
    if (timeMatch) { start = timeMatch[1].padStart(5,"0"); end = timeMatch[2].padStart(5,"0"); }
    else if (slotMatch && TT_SLOTS[slotMatch[1]]) {
      start = TT_SLOTS[slotMatch[1]][0];
      end = TT_SLOTS[slotMatch[2] || slotMatch[1]]?.[1] || TT_SLOTS[slotMatch[1]][1];
    } else return;

    out.push({day,start,end,subjectName:m[3].trim(),subjectId:matchSubjectId(m[3]),
      room:(m[4] || "").trim(),teacher:"",week:"both"});
  });

  if (!out.length) { toast("Keine Zeile erkannt. Format prüfen."); return; }
  ttPending = out;
  openTimetableReview();
}

/* ---------- Streak mit Schonfrist (1 Fehltag pro 7 Tage) ---------- */
const _streak = streak;
streak = function(){
  if (!state.settings.streakGrace) return _streak();
  const dates = activityDates();
  let count = 0, cursor = iso(), grace = 1, sinceGrace = 0;
  if (!dates.has(cursor)) cursor = addDays(cursor,-1);
  while (count < 3650) {
    if (dates.has(cursor)) { count++; sinceGrace++; }
    else if (grace > 0 && count > 0) { grace--; sinceGrace = 0; }
    else break;
    if (sinceGrace >= 7) grace = 1;
    cursor = addDays(cursor,-1);
  }
  return count;
};

function monthKey(d = iso()){ return d.slice(0,7); }
function financeMonth(){
  const e = state.finance.entries.filter(x => monthKey(x.date) === monthKey());
  const inc = e.filter(x => x.amount > 0).reduce((s,x) => s + x.amount,0);
  const out = e.filter(x => x.amount < 0).reduce((s,x) => s - x.amount,0);
  const d = new Date(); const daysLeft = new Date(d.getFullYear(),d.getMonth()+1,0).getDate() - d.getDate() + 1;
  const budget = Number(state.finance.budget) || inc;
  const left = budget - out;
  return {entries:e,inc,out,left,perDay:left / Math.max(1,daysLeft),daysLeft};
}

function abiCalc(){
  const c = state.abi.courses, ex = state.abi.exams;
  const weighted = c.reduce((s,x) => s + x.points * (x.lk ? 2 : 1),0);
  const n = c.reduce((s,x) => s + (x.lk ? 2 : 1),0);
  const block1 = n ? clamp(Math.round(weighted * 40 / n),0,600) : 0;
  const factor = ex.length >= 5 ? 4 : 5;
  const block2 = clamp(ex.reduce((s,x) => s + x.points * factor,0),0,300);
  const total = block1 + block2;
  const grade = total >= 300 ? clamp(Math.floor((17/3 - total/180) * 10) / 10,1,4) : null;
  const deficits = c.filter(x => x.points < 5).length;
  const zeros = c.filter(x => x.points === 0).length;
  const maxDef = n >= 40 ? 8 : 7;
  return {block1,block2,total,grade,deficits,zeros,maxDef,n,exCount:ex.length};
}

let ambientNodes = null;
function stopAmbient(){ if (ambientNodes) { ambientNodes.forEach(n => { try { n.stop?.(); n.disconnect?.(); } catch {} }); ambientNodes = null; } }
function playAmbient(type){
  stopAmbient();
  audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === "suspended") audioContext.resume();
  const ctx = audioContext, nodes = [];
  const gain = ctx.createGain(); gain.gain.value = .14; gain.connect(ctx.destination);
  if (type === "binaural") {
    const l = ctx.createOscillator(), r = ctx.createOscillator(), pl = ctx.createStereoPanner(), pr = ctx.createStereoPanner();
    l.frequency.value = 200; r.frequency.value = 210; pl.pan.value = -1; pr.pan.value = 1;
    l.connect(pl).connect(gain); r.connect(pr).connect(gain); l.start(); r.start(); nodes.push(l,r);
  } else {
    const buf = ctx.createBuffer(1,ctx.sampleRate * 3,ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (type === "white") d[i] = w * .5; else { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; } }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    let out = src;
    if (type === "rain") { const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 800; src.connect(f); out = f; }
    if (type === "ocean") {
      const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .12; lg.gain.value = .5;
      lfo.connect(lg).connect(gain.gain); lfo.start(); nodes.push(lfo);
    }
    out.connect(gain); src.start(); nodes.push(src);
  }
  ambientNodes = nodes;
}
toggleNoise = function(){
  if (ambientNodes) { stopAmbient(); const l = $("#noiseLabel"); if (l) l.textContent = "Sound starten"; return; }
  playAmbient(state.settings.ambient); const l = $("#noiseLabel"); if (l) l.textContent = "Sound stoppen";
};

let speakRec = null, speakListening = false, speakBusy = false, speakLive = "";

function speakLangInfo(){ return SPEAK_LANGS.find(l => l.code === state.speak.lang) || SPEAK_LANGS[0]; }
function speechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

function speakInstructions(){
  const L = speakLangInfo();
  return `Rollenspiel zum Sprachenlernen. Zielsprache: ${L.name}. Niveau: ${state.speak.level}.
Szenario: ${SPEAK_SCENARIOS[state.speak.scenario]}.
Regeln:
- Antworte NUR in der Zielsprache, 1 bis 3 kurze Sätze, passend zum Niveau, und beende immer mit einer Frage, damit das Gespräch weitergeht.
- Bringe pro Antwort höchstens ein neues nützliches Wort ein und markiere es so: **Wort**.
- Wenn der Lernende Fehler macht (Grammatik, Wortwahl, Satzbau), füge NACH deiner Antwort eine eigene Zeile an, die mit "KORREKTUR:" beginnt und auf Deutsch knapp erklärt, was besser wäre. Gab es keinen nennenswerten Fehler, lass diese Zeile weg.
- Aussprachefehler kannst du nicht hören; beurteile nur den Text.
- Bleibe freundlich, geduldig und in der Rolle.`;
}

function splitReply(text){
  const i = text.search(/\n?\s*KORREKTUR\s*:/i);
  if (i < 0) return {say:text.trim(),fix:""};
  return {say:text.slice(0,i).trim(),fix:text.slice(i).replace(/^\s*KORREKTUR\s*:\s*/i,"").trim()};
}
function extractVocab(text){ return [...text.matchAll(/\*\*([^*]{1,40})\*\*/g)].map(m => m[1].trim()); }

function ttsSpeak(text){
  if (!state.speak.speakOut || !("speechSynthesis" in window)) return Promise.resolve();
  return new Promise(res => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\*\*/g,""));
    u.lang = state.speak.lang;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace("_","-").toLowerCase().startsWith(state.speak.lang.slice(0,2)));
    if (v) u.voice = v;
    u.rate = state.speak.level === "A1" ? .85 : .95;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}

function startListening(){
  if (!speechSupported()) { toast("Spracherkennung wird in diesem Browser nicht unterstützt. Nutze Chrome oder Edge oder tippe unten."); return; }
  if (speakListening || speakBusy) return;
  speechSynthesis?.cancel();
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  speakRec = new R();
  speakRec.lang = state.speak.lang; speakRec.interimResults = true; speakRec.continuous = false; speakRec.maxAlternatives = 1;
  let finalText = "";
  speakRec.onresult = e => {
    let interim = "";
    for (const r of e.results) { if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    speakLive = finalText || interim; const el = $("#speakLive"); if (el) el.textContent = speakLive || "…";
  };
  speakRec.onerror = e => { speakListening = false; renderSpeak(); if (e.error !== "no-speech" && e.error !== "aborted") toast("Mikrofon: " + e.error); };
  speakRec.onend = () => {
    speakListening = false;
    const t = finalText.trim();
    if (t) sendSpeak(t); else renderSpeak();
  };
  speakListening = true; speakLive = ""; renderSpeak();
  try { speakRec.start(); } catch { speakListening = false; renderSpeak(); }
}
function stopListening(){ try { speakRec?.stop(); } catch {} }

async function sendSpeak(text){
  if (speakBusy) return;
  if (!aiReady()) { toast("Richte zuerst den KI-Dienst ein."); openAISettings(); return; }
  state.speak.messages.push({id:uid(),role:"user",content:text});
  speakBusy = true; save(); renderSpeak();
  try {
    const history = [
      {role:"user",content:speakInstructions()},
      {role:"assistant",content:"Verstanden, ich bleibe in der Rolle."},
      ...state.speak.messages.slice(-12).map(m => ({role:m.role,content:m.content}))
    ];
    const reply = await requestAIText(history,{timeoutMs:60000});
    const {say,fix} = splitReply(reply);
    state.speak.messages.push({id:uid(),role:"assistant",content:say,fix,vocab:extractVocab(say)});
    speakBusy = false; save(); renderSpeak();
    await ttsSpeak(say);
    if (state.speak.handsFree && learnTab === "speak") startListening();
  } catch (e) {
    state.speak.messages.push({id:uid(),role:"assistant",content:"(Fehler: " + e.message + ")",error:true});
    speakBusy = false; save(); renderSpeak();
  }
}

function startScenario(){
  state.speak.messages = [];
  save();
  sendSpeak(state.speak.lang.startsWith("de") ? "Hallo, lass uns anfangen." : state.speak.lang.startsWith("fr") ? "Bonjour, on commence ?" : state.speak.lang.startsWith("es") ? "Hola, ¿empezamos?" : state.speak.lang.startsWith("it") ? "Ciao, cominciamo?" : "Hi, let's start.");
}

function saveVocabCard(word,context){
  const L = speakLangInfo();
  const subj = state.subjects.find(s => s.name.toLowerCase().startsWith(L.subject.slice(0,5)))?.id || state.subjects[0].id;
  if (state.cards.some(c => c.question.toLowerCase() === word.toLowerCase())) { toast("Karte gibt es schon."); return; }
  state.cards.push({id:uid(),subjectId:subj,type:"basic",question:word,answer:`Übersetzung ergänzen · Kontext: ${context.replace(/\*\*/g,"").slice(0,120)}`,due:iso(),interval:0,ease:2.5,reps:0,createdAt:new Date().toISOString()});
  addXP(3); save(); toast(`„${word}“ als Karte gespeichert – Übersetzung bitte eintragen.`);
}

function loadSyncCfg(){

/* Alle synchronisierten Listen (inkl. Unterlisten) einheitlich greifen */
function getSyncCol(obj,key){
  if (!obj) return [];
  if (key === "finance.entries") return Array.isArray(obj.finance?.entries) ? obj.finance.entries : [];
  if (key === "abi.courses") return Array.isArray(obj.abi?.courses) ? obj.abi.courses : [];
  if (key === "abi.exams") return Array.isArray(obj.abi?.exams) ? obj.abi.exams : [];
  if (key === "coachMessages") return (Array.isArray(obj.coachMessages) ? obj.coachMessages : []).slice(-40);
  if (key === "speak.messages") return (Array.isArray(obj.speak?.messages) ? obj.speak.messages : []).slice(-40);
  return Array.isArray(obj[key]) ? obj[key] : [];
}
function setSyncCol(obj,key,arr){
  if (key === "finance.entries") { obj.finance = {...(obj.finance || {}),entries:arr}; return; }
  if (key === "abi.courses") { obj.abi = {...(obj.abi || {}),courses:arr}; return; }
  if (key === "abi.exams") { obj.abi = {...(obj.abi || {}),exams:arr}; return; }
  if (key === "speak.messages") { obj.speak = {...(obj.speak || {}),messages:arr}; return; }
  obj[key] = arr;
}
const ALL_SYNC_COLS = [...SYNC_ARRAYS,"finance.entries","abi.courses","abi.exams","coachMessages","speak.messages"];

function getScalarGroup(obj,g){
  if (!obj) return {};
  if (g === "profile") return obj.profile || {};
  if (g === "settings") return obj.settings || {};
  if (g === "finance") return {budget:obj.finance?.budget || 0,savingGoal:obj.finance?.savingGoal || 0,savingName:obj.finance?.savingName || ""};
  if (g === "speak") return {lang:obj.speak?.lang || "en-US",scenario:obj.speak?.scenario || "restaurant",level:obj.speak?.level || "A2",handsFree:!!obj.speak?.handsFree,speakOut:obj.speak?.speakOut !== false};
  if (g === "ai") { const a = {...(obj.ai || {})}; delete a.secret; return a; }
  return {};
}
function setScalarGroup(obj,g,val){
  if (g === "profile") obj.profile = {...obj.profile,...val};
  if (g === "settings") obj.settings = {...obj.settings,...val};
  if (g === "finance") obj.finance = {...(obj.finance || {}),...val,entries:obj.finance?.entries || []};
  if (g === "speak") obj.speak = {...(obj.speak || {}),...val,messages:obj.speak?.messages || []};
  if (g === "ai") obj.ai = {...(obj.ai || {}),...val};
}
const ALL_SCALARS = ["profile","settings","finance","speak","ai"];

/* Lokale Änderungen seit dem letzten Abgleich mit Zeitstempel versehen */
function stampLocalChanges(){
  const meta = loadSyncMeta();
  const now = new Date().toISOString();
  const hadSnap = Object.keys(meta.snap.items || {}).length > 0;
  meta.snap.items = meta.snap.items || {};
  meta.snap.maps = meta.snap.maps || {};
  meta.snap.scalars = meta.snap.scalars || {};

  for (const col of ALL_SYNC_COLS) {
    const prev = meta.snap.items[col] || {};
    const seen = new Set();
    for (const item of getSyncCol(state,col)) {
      if (!item.id) item.id = uid();
      seen.add(item.id);
      const ser = JSON.stringify(item);
      if (prev[item.id] !== undefined && prev[item.id] !== ser) meta.itemU[item.id] = now;
      else if (prev[item.id] === undefined && !meta.itemU[item.id]) {
        meta.itemU[item.id] = item.updatedAt || item.createdAt || (hadSnap ? now : "2000-01-01T00:00:00.000Z");
      }
    }
    for (const oldId of Object.keys(prev)) {
      if (!seen.has(oldId)) { meta.deleted[oldId] = now; delete meta.itemU[oldId]; }
    }
  }

  for (const m of SYNC_MAPS) {
    const prev = meta.snap.maps[m] || {};
    const cur = state[m] || {};
    meta.mapU[m] = meta.mapU[m] || {};
    for (const k of Object.keys(cur)) {
      const ser = JSON.stringify(cur[k]);
      if (prev[k] !== ser) meta.mapU[m][k] = hadSnap || prev[k] !== undefined ? now : "2000-01-01T00:00:00.000Z";
    }
  }

  for (const g of ALL_SCALARS) {
    const ser = JSON.stringify(getScalarGroup(state,g));
    if (meta.snap.scalars[g] !== ser) {
      meta.scalarU[g] = hadSnap ? now : (state.profile?.onboarded ? "2000-01-01T00:00:00.000Z" : "");
    }
  }

  saveSyncMeta(meta);
  return meta;
}

function recordSnapshot(meta){
  meta.snap = {items:{},maps:{},scalars:{}};
  for (const col of ALL_SYNC_COLS) {
    const map = {};
    for (const item of getSyncCol(state,col)) if (item.id) map[item.id] = JSON.stringify(item);
    meta.snap.items[col] = map;
  }
  for (const m of SYNC_MAPS) {
    const map = {}, cur = state[m] || {};
    for (const k of Object.keys(cur)) map[k] = JSON.stringify(cur[k]);
    meta.snap.maps[m] = map;
  }
  for (const g of ALL_SCALARS) meta.snap.scalars[g] = JSON.stringify(getScalarGroup(state,g));

  /* Alte Lösch-Marker nach 60 Tagen aufräumen */
  const cutoff = new Date(Date.now() - 60 * 86400000).toISOString();
  for (const [id,t] of Object.entries(meta.deleted || {})) if (t < cutoff) delete meta.deleted[id];
  saveSyncMeta(meta);
}

function buildCloudData(){
  const data = {version:2};
  for (const col of ALL_SYNC_COLS) setSyncCol(data,col,getSyncCol(state,col));
  for (const m of SYNC_MAPS) data[m] = state[m] || {};
  for (const g of ALL_SCALARS) setScalarGroup(data,g,getScalarGroup(state,g));
  return data;
}

function mergeWithRemote(remote,meta){
  const rData = remote?.data || {};
  const rMeta = remote?.meta || {};
  const localFresh = !state.profile?.onboarded && !!rData.profile?.onboarded;

  const deleted = {...(rMeta.deleted || {})};
  for (const [id,t] of Object.entries(meta.deleted || {})) {
    if (!deleted[id] || t > deleted[id]) deleted[id] = t;
  }
  const itemU = {...(rMeta.itemU || {})};
  for (const [id,t] of Object.entries(meta.itemU || {})) {
    if (!itemU[id] || t > itemU[id]) itemU[id] = t;
  }

  for (const col of ALL_SYNC_COLS) {
    const lMap = new Map(getSyncCol(state,col).map(x => [x.id,x]));
    const rMap = new Map(getSyncCol(rData,col).map(x => [x.id,x]));
    const ids = new Set([...rMap.keys(),...lMap.keys()]);
    const merged = [];
    for (const id of ids) {
      const l = lMap.get(id), r = rMap.get(id);
      const lt = meta.itemU[id] || l?.updatedAt || l?.createdAt || "";
      const rt = rMeta.itemU?.[id] || r?.updatedAt || r?.createdAt || "";
      const maxT = lt > rt ? lt : rt;
      if (deleted[id] && deleted[id] >= maxT) continue;
      if (l && r) merged.push((localFresh || rt >= lt) ? r : l);
      else merged.push(r || l);
    }
    setSyncCol(state,col,merged);
  }

  for (const m of SYNC_MAPS) {
    const lObj = state[m] || {}, rObj = rData[m] || {};
    const keys = new Set([...Object.keys(rObj),...Object.keys(lObj)]);
    const out = {};
    meta.mapU[m] = meta.mapU[m] || {};
    for (const k of keys) {
      const lt = meta.mapU[m][k] || "", rt = rMeta.mapU?.[m]?.[k] || "";
      const useR = k in rObj && (!(k in lObj) || localFresh || rt >= lt);
      out[k] = useR ? rObj[k] : lObj[k];
      meta.mapU[m][k] = lt > rt ? lt : rt;
    }
    state[m] = out;
  }

  for (const g of ALL_SCALARS) {
    const lt = meta.scalarU[g] || "", rt = rMeta.scalarU?.[g] || "";
    const lVal = getScalarGroup(state,g), rVal = getScalarGroup(rData,g);
    if (Object.keys(rVal).length && (localFresh || rt >= lt)) {
      const merged = {...lVal,...rVal};
      if (g === "profile") merged.xp = Math.max(Number(lVal.xp) || 0,Number(rVal.xp) || 0);
      setScalarGroup(state,g,merged);
      meta.scalarU[g] = rt;
    }
  }

  meta.deleted = deleted;
  meta.itemU = itemU;
}

/* GitHub Gist API */
async function ghRequest(path,token,method = "GET",body = null){
  const res = await fetch(`https://api.github.com${path}`,{
    method,
    cache:"no-store",
    headers:{
      Authorization:`Bearer ${token}`,
      Accept:"application/vnd.github+json",
      ...(body ? {"Content-Type":"application/json"} : {})
    },
    ...(body ? {body:JSON.stringify(body)} : {})
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(res.status === 401 ? "Token ungültig oder abgelaufen." : (err.message || `GitHub HTTP ${res.status}`));
  }
  return res.json();
}

async function ensureGist(cfg){
  if (cfg.gistId) return cfg.gistId;
  /* Vorhandenen Fokus-Gist automatisch suchen */
  const list = await ghRequest("/gists?per_page=100",cfg.token);
  const found = Array.isArray(list) && list.find(g => g.files && g.files[SYNC_FILENAME]);
  if (found) { cfg.gistId = found.id; saveSyncCfg(cfg); return found.id; }
  /* Sonst neuen geheimen Gist automatisch anlegen */
  const created = await ghRequest("/gists",cfg.token,"POST",{
    description:"Fokus Lern-App Cloud-Sync (privat)",
    public:false,
    files:{[SYNC_FILENAME]:{content:JSON.stringify({version:2,updatedAt:null,data:null,meta:{}})}}
  });
  cfg.gistId = created.id;
  saveSyncCfg(cfg);
  return created.id;
}

async function syncNow(silent = true){
  const cfg = loadSyncCfg();
  if (!cfg.token || syncRunning) return;
  syncRunning = true; syncState = "busy"; updateSyncIndicator();

  try {
    const meta = stampLocalChanges();
    const gistId = await ensureGist(cfg);
    const gist = await ghRequest(`/gists/${gistId}`,cfg.token);
    const file = gist.files?.[SYNC_FILENAME];
    let raw = file?.content || "{}";
    if (file?.truncated && file?.raw_url) {
      raw = await (await fetch(file.raw_url,{cache:"no-store"})).text();
    }
    let remote = {};
    try { remote = JSON.parse(raw) || {}; } catch { remote = {}; }

    const wasUnonboarded = !state.profile?.onboarded;
    const beforeRemoteStr = JSON.stringify(remote.data || null);

    if (remote.data) mergeWithRemote(remote,meta);

    syncApplying = true;
    migrateState();
    ensureTimerState();
    save(false);
    syncApplying = false;

    const newData = buildCloudData();
    const afterStr = JSON.stringify(newData);
    if (afterStr !== beforeRemoteStr) {
      await ghRequest(`/gists/${gistId}`,cfg.token,"PATCH",{
        files:{[SYNC_FILENAME]:{content:JSON.stringify({
          version:2,
          updatedAt:new Date().toISOString(),
          data:newData,
          meta:{deleted:meta.deleted,itemU:meta.itemU,mapU:meta.mapU,scalarU:meta.scalarU}
        })}}
      });
    }

    recordSnapshot(meta);
    cfg.lastSync = new Date().toISOString();
    syncLastError = "";
    syncState = "ok";
    saveSyncCfg(cfg);

    if (wasUnonboarded && state.profile?.onboarded) closeSheet();
    render();
    if (!silent) toast("Synchronisiert! Tablet & PC sind auf demselben Stand. ☁️");
  } catch (e) {
    syncApplying = false;
    syncLastError = e.message || "Verbindungsfehler";
    syncState = "err";
    updateSyncIndicator();
    if (!silent) toast("Sync-Fehler: " + syncLastError);
  } finally {
    syncRunning = false;
  }
}

/* Automatischer Sync bei jeder Änderung (mit 2,5 Sek. Puffer) */
const _origSaveSync = save;
save = function(renderAfter = false){
  _origSaveSync(renderAfter);
  if (syncApplying || !syncConfigured()) return;
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(() => syncNow(true),2500);
};

/* Wolken-Button oben rechts in die Leiste einbauen */
function updateSyncIndicator(){
  let btn = document.getElementById("syncTopBtn");
  if (!btn) {
    const bar = document.querySelector(".top-actions");
    if (!bar) return;
    bar.insertAdjacentHTML("afterbegin",
      `<button class="icon-btn sync-btn" id="syncTopBtn" onclick="openSyncSheet()" title="Geräte-Sync" aria-label="Geräte-Sync">☁️<i class="sync-dot" id="syncDot"></i></button>`);
    btn = document.getElementById("syncTopBtn");
  }
  const dot = document.getElementById("syncDot");
  if (!dot) return;
  const st = syncConfigured() ? syncState : "off";
  dot.className = "sync-dot " + (st === "ok" ? "ok" : st === "busy" ? "busy" : st === "err" ? "err" : "");
}

function openSyncSheet(){
  const cfg = loadSyncCfg();
  const pairCode = cfg.token ? `${cfg.gistId}|${cfg.token}` : "";
  openSheet(`
    <div class="sheet-head">
      <div>
        <h2>☁️ Geräte-Sync (Tablet & PC)</h2>
        <div class="small muted">100 % kostenlos über deinen privaten GitHub Gist</div>
      </div>
      <button class="icon-btn" onclick="closeSheet()" aria-label="Schließen">✕</button>
    </div>

    <div class="sync-status-box">
      <strong>Status:</strong> ${!cfg.token ? "Noch nicht verbunden" : syncState === "ok" ? "✅ Verbunden & synchron" : syncState === "busy" ? "🔄 Synchronisiert gerade …" : syncState === "err" ? "⚠️ " + esc(syncLastError) : "Bereit"}
      ${cfg.lastSync ? `<br><span class="muted">Zuletzt abgeglichen: ${new Date(cfg.lastSync).toLocaleTimeString("de-DE")}</span>` : ""}
    </div>

    <form onsubmit="saveSyncForm(event)">
      <label class="field">GitHub Token (oder Koppel-Code vom anderen Gerät)
        <input type="password" name="token" required autocomplete="off"
          value="${esc(pairCode || cfg.token)}" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </label>
      <label class="field">Gist-ID (wird automatisch ausgefüllt!)
        <input name="gistId" value="${esc(cfg.gistId)}" placeholder="Leer lassen – wird automatisch gefunden/erstellt">
      </label>
      <div class="btn-row">
        <button class="btn primary">${cfg.token ? "Jetzt synchronisieren" : "Verbinden & synchronisieren"}</button>
        ${pairCode ? `<button type="button" class="btn" onclick="navigator.clipboard.writeText(${JSON.stringify(pairCode)}).then(()=>toast('Koppel-Code kopiert! Auf dem 2. Gerät einfügen.'))">📋 Code fürs 2. Gerät kopieren</button>` : ""}
        ${cfg.token ? `<button type="button" class="btn danger" onclick="disconnectSync()">Trennen</button>` : ""}
      </div>
    </form>
    <p class="small muted" style="margin-top:12px">
      Dein Token bleibt ausschließlich auf diesem Gerät gespeichert und wird niemals mit hochgeladen.
    </p>`);
}

function saveSyncForm(e){
  e.preventDefault();
  const f = new FormData(e.target);
  let rawToken = String(f.get("token") || "").trim();
  let gistId = String(f.get("gistId") || "").trim();
  if (rawToken.includes("|")) {
    const [g,t] = rawToken.split("|");
    gistId = g.trim(); rawToken = t.trim();
  }
  if (gistId.includes("/")) gistId = gistId.split("/").pop().trim();
  saveSyncCfg({token:rawToken,gistId,lastSync:loadSyncCfg().lastSync || ""});
  closeSheet();
  syncNow(false);
}

function disconnectSync(){
  if (!confirm("Sync auf diesem Gerät trennen? Deine lokalen Daten bleiben erhalten.")) return;
  localStorage.removeItem(SYNC_CFG_KEY);
  syncState = "off"; updateSyncIndicator(); closeSheet();
  toast("Sync getrennt.");
}

/* Im Onboarding direkt einen Knopf für bestehendes 2. Gerät anbieten */
const _origRenderOnboardSync = renderOnboarding;
renderOnboarding = function(){
  _origRenderOnboardSync();
  if (onboardStep === 0) {
    document.querySelector(".sheet .btn-row")?.insertAdjacentHTML("beforeend",
      `<button type="button" class="btn" onclick="openSyncSheet()">☁️ Mit PC/Tablet koppeln</button>`);
  }
};

/* Beim Öffnen, beim Zurückkehren zum Tab und alle 2 Minuten abgleichen */
setTimeout(() => { updateSyncIndicator(); if (syncConfigured()) syncNow(true); },600);
document.addEventListener("visibilitychange",() => { if (!document.hidden && syncConfigured()) syncNow(true); });
window.addEventListener("online",() => { if (syncConfigured()) syncNow(true); });
setInterval(() => { if (!document.hidden && syncConfigured()) syncNow(true); },120000);
startApp();
</script>
