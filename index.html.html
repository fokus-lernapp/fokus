
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>Fokus – Deine Lern-App</title>

<style>
:root{
  --accent:#6c5ce7;
  --accent-rgb:108,92,231;
  --accent-2:#00b894;
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#eef1f7;
  --text:#172033;
  --muted:#687086;
  --border:#e1e5ee;
  --danger:#e74c3c;
  --warning:#f39c12;
  --success:#00a878;
  --shadow:0 12px 36px rgba(30,43,76,.10);
  --radius:22px;
  --font-scale:1;
}

html[data-theme="dark"]{
  --bg:#0e1220;
  --surface:#171c2d;
  --surface-2:#20263a;
  --text:#f5f7ff;
  --muted:#aab2c8;
  --border:#2d344a;
  --shadow:0 16px 38px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html{font-size:calc(16px * var(--font-scale));scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 0%,rgba(var(--accent-rgb),.12),transparent 28rem),
    var(--bg);
  font-family:Inter,ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(var(--accent-rgb),.25);
  outline-offset:2px;
}
button:disabled{opacity:.48;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.nowrap{white-space:nowrap}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.text-warning{color:var(--warning)}

.app{
  width:min(1160px,100%);
  min-height:100vh;
  margin:auto;
  padding:0 18px 105px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:72px;
  padding:10px 0;
  background:linear-gradient(var(--bg) 72%,transparent);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  border-radius:15px;
  color:#fff;
  background:linear-gradient(145deg,var(--accent),#a66bff);
  box-shadow:0 10px 25px rgba(var(--accent-rgb),.28);
  font-size:1.25rem;
  font-weight:900;
  transform:rotate(-3deg);
}
.brand strong{display:block;font-size:1.04rem}
.brand span{font-size:.72rem;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px}
.xp-pill{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--surface);
  box-shadow:var(--shadow);
  font-size:.78rem;
  font-weight:800;
}
.icon-btn{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  padding:0;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
  cursor:pointer;
}

main{animation:viewIn .28s ease both}
@keyframes viewIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:max(10px,env(safe-area-inset-bottom));
  z-index:50;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  width:min(680px,calc(100% - 22px));
  padding:8px;
  border:1px solid rgba(150,160,180,.22);
  border-radius:24px;
  background:rgba(255,255,255,.89);
  box-shadow:0 16px 45px rgba(20,28,50,.20);
  backdrop-filter:blur(20px);
  transform:translateX(-50%);
}
html[data-theme="dark"] .bottom-nav{background:rgba(23,28,45,.90)}
.nav-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:8px 4px;
  border:0;
  border-radius:16px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:.68rem;
  font-weight:700;
}
.nav-btn .nav-icon{font-size:1.22rem}
.nav-btn.active{
  color:var(--accent);
  background:rgba(var(--accent-rgb),.11);
}

.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin:8px 0 18px;
}
.page-head h1{margin:0;font-size:clamp(1.65rem,4vw,2.35rem);line-height:1.05}
.page-head p{margin:7px 0 0;color:var(--muted)}
.hero{
  position:relative;
  overflow:hidden;
  padding:24px;
  border:1px solid rgba(var(--accent-rgb),.18);
  border-radius:28px;
  color:#fff;
  background:
    radial-gradient(circle at 90% 10%,rgba(255,255,255,.26),transparent 11rem),
    linear-gradient(135deg,var(--accent),#8957e5 58%,#00a98f);
  box-shadow:0 20px 44px rgba(var(--accent-rgb),.22);
}
.hero:after{
  content:"";
  position:absolute;
  right:-25px;
  bottom:-45px;
  width:170px;
  height:170px;
  border:26px solid rgba(255,255,255,.09);
  border-radius:50%;
}
.hero h1{position:relative;z-index:1;margin:0 0 7px;font-size:clamp(1.7rem,5vw,2.65rem)}
.hero p{position:relative;z-index:1;margin:0;max-width:650px;color:rgba(255,255,255,.88)}
.hero-why{
  position:relative;
  z-index:1;
  display:inline-flex;
  margin-top:18px;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  background:rgba(255,255,255,.13);
  font-size:.82rem;
}

.grid{display:grid;gap:16px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.dashboard-grid{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:16px;
  margin-top:16px;
}
.stack{display:grid;gap:16px}
.card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  box-shadow:0 8px 25px rgba(25,35,60,.055);
}
.card.pad{padding:19px}
.card h2,.card h3{margin:0}
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
}
.section-title h2{font-size:1.05rem}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:999px;
  color:var(--accent);
  background:rgba(var(--accent-rgb),.10);
  font-size:.72rem;
  font-weight:800;
}
.badge.red{color:var(--danger);background:rgba(231,76,60,.11)}
.badge.orange{color:#bd6b00;background:rgba(243,156,18,.13)}
.badge.green{color:var(--success);background:rgba(0,168,120,.12)}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:43px;
  padding:10px 15px;
  border:0;
  border-radius:14px;
  background:var(--surface-2);
  cursor:pointer;
  font-weight:800;
  transition:transform .16s ease,filter .16s ease,background .16s ease;
}
.btn:hover{filter:brightness(.98);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{color:#fff;background:var(--accent)}
.btn.success{color:#fff;background:var(--success)}
.btn.danger{color:#fff;background:var(--danger)}
.btn.ghost{border:1px solid var(--border);background:transparent}
.btn.small{min-height:35px;padding:7px 10px;font-size:.78rem}
.btn.wide{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:9px}
.circle-btn{
  display:grid;
  place-items:center;
  width:38px;height:38px;
  padding:0;
  border:0;
  border-radius:50%;
  background:var(--surface-2);
  cursor:pointer;
}

.rings{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.ring-wrap{text-align:center}
.ring{
  --value:0%;
  --ring-color:var(--accent);
  position:relative;
  display:grid;
  place-items:center;
  width:88px;
  max-width:100%;
  aspect-ratio:1;
  margin:auto;
  border-radius:50%;
  background:conic-gradient(var(--ring-color) var(--value),var(--surface-2) 0);
  transition:background .5s ease;
}
.ring:before{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:50%;
  background:var(--surface);
}
.ring strong{
  position:relative;
  z-index:1;
  font-size:.93rem;
}
.ring-label{margin-top:7px;color:var(--muted);font-size:.72rem;font-weight:700}

.checkin{display:flex;gap:8px}
.checkin button{
  flex:1;
  padding:12px 5px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--surface-2);
  cursor:pointer;
}
.checkin button.active{
  color:var(--accent);
  border-color:var(--accent);
  background:rgba(var(--accent-rgb),.10);
}

.brief-item,.success-item,.warning-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.brief-item:last-child,.success-item:last-child,.warning-item:last-child{border-bottom:0}
.brief-dot{
  flex:0 0 auto;
  width:11px;
  height:11px;
  margin-top:5px;
  border-radius:50%;
}
.brief-content{flex:1;min-width:0}
.brief-content strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief-content span{color:var(--muted);font-size:.78rem}
.check-btn{
  flex:0 0 auto;
  display:grid;
  place-items:center;
  width:31px;height:31px;
  padding:0;
  border:2px solid var(--border);
  border-radius:50%;
  background:transparent;
  cursor:pointer;
}
.check-btn:hover{border-color:var(--success);color:var(--success)}

.progress-row{margin:13px 0}
.progress-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:.82rem}
.progress{
  height:9px;
  overflow:hidden;
  border-radius:99px;
  background:var(--surface-2);
}
.progress>span{
  display:block;
  height:100%;
  border-radius:inherit;
  background:var(--accent);
  transition:width .45s ease;
}

.segmented{
  display:flex;
  gap:5px;
  margin:0 0 16px;
  padding:5px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--surface);
}
.segmented button{
  flex:1 0 auto;
  padding:9px 12px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:.8rem;
  font-weight:800;
}
.segmented button.active{color:var(--text);background:var(--surface-2)}

.quick-input{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
.quick-input input{flex:1}

input,select,textarea{
  width:100%;
  min-height:44px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:13px;
  color:var(--text);
  background:var(--surface-2);
}
textarea{min-height:90px;resize:vertical}
label.field{display:grid;gap:6px;margin-bottom:13px;font-size:.82rem;font-weight:750}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.form-grid .full{grid-column:1/-1}

.week-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.week-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(155px,1fr));
  gap:10px;
  overflow:auto;
  padding:2px 2px 10px;
}
.day-column{
  min-height:235px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--surface);
}
.day-column.today{
  border-color:rgba(var(--accent-rgb),.6);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08);
}
.day-head{margin-bottom:11px}
.day-head strong{display:block}
.day-head span{color:var(--muted);font-size:.72rem}
.plan-chip{
  display:block;
  width:100%;
  margin:7px 0;
  padding:9px;
  border:0;
  border-left:4px solid var(--accent);
  border-radius:11px;
  text-align:left;
  background:var(--surface-2);
  cursor:pointer;
  font-size:.72rem;
}
.plan-chip.done{opacity:.55;text-decoration:line-through}
.lesson-chip{
  margin:6px 0;
  padding:7px 8px;
  border-radius:10px;
  background:rgba(var(--accent-rgb),.09);
  font-size:.69rem;
}

.task-list{display:grid;gap:11px}
.task{
  position:relative;
  overflow:hidden;
  padding:15px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--surface);
  touch-action:pan-y;
  transition:transform .2s ease,opacity .2s ease;
}
.task.done{opacity:.62}
.task.done .task-title{text-decoration:line-through}
.task-top{display:flex;align-items:flex-start;gap:11px}
.task-color{width:8px;align-self:stretch;min-height:44px;border-radius:99px}
.task-main{flex:1;min-width:0}
.task-title{font-weight:850}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;color:var(--muted);font-size:.73rem}
.task-actions{display:flex;gap:5px}
.priority-high{color:var(--danger)}
.priority-medium{color:var(--warning)}
.priority-low{color:var(--success)}
.subtasks{
  display:grid;
  gap:7px;
  margin:12px 0 0 19px;
  padding-top:11px;
  border-top:1px solid var(--border);
}
.subtask{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:.79rem;
}
.subtask input{width:18px;min-height:18px;margin:0}
.subtask.done span{text-decoration:line-through;color:var(--muted)}

.empty{
  padding:32px 18px;
  text-align:center;
  color:var(--muted);
}
.empty-icon{display:block;margin-bottom:8px;font-size:2.2rem}

.subject-card{
  padding:14px;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--surface);
}
.subject-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.subject-name{display:flex;align-items:center;gap:9px;font-weight:850}
.subject-icon{
  display:grid;
  place-items:center;
  width:35px;height:35px;
  border-radius:12px;
  color:#fff;
}

.flashcard-stage{perspective:1100px}
.flashcard{
  position:relative;
  min-height:290px;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform .48s cubic-bezier(.2,.75,.25,1);
}
.flashcard.flipped{transform:rotateY(180deg)}
.flash-face{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px;
  border:1px solid var(--border);
  border-radius:26px;
  text-align:center;
  background:var(--surface);
  box-shadow:var(--shadow);
  backface-visibility:hidden;
}
.flash-face.back{transform:rotateY(180deg);background:linear-gradient(145deg,var(--surface),rgba(var(--accent-rgb),.08))}
.flash-face small{position:absolute;top:17px;color:var(--muted)}
.flash-face h2{font-size:clamp(1.25rem,4vw,2rem);line-height:1.35}
.rating-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}
.rating-grid button{padding:10px 4px;font-size:.75rem}

.quiz-options{display:grid;gap:9px;margin-top:16px}
.quiz-option{
  padding:13px;
  border:1px solid var(--border);
  border-radius:14px;
  text-align:left;
  background:var(--surface-2);
  cursor:pointer;
}
.quiz-option.correct{color:#fff;border-color:var(--success);background:var(--success)}
.quiz-option.wrong{color:#fff;border-color:var(--danger);background:var(--danger)}

.focus-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.timer-card{text-align:center}
.timer-ring{
  --timer-value:0%;
  position:relative;
  display:grid;
  place-items:center;
  width:min(285px,78vw);
  aspect-ratio:1;
  margin:18px auto;
  border-radius:50%;
  background:conic-gradient(var(--accent) var(--timer-value),var(--surface-2) 0);
}
.timer-ring:before{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:50%;
  background:var(--surface);
}
.timer-time{
  position:relative;
  z-index:1;
  font-size:clamp(2.6rem,10vw,4.7rem);
  font-weight:900;
  letter-spacing:-.05em;
}
.timer-goal{
  position:relative;
  z-index:1;
  max-width:70%;
  color:var(--muted);
  font-size:.8rem;
}
.preset-row{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}
.preset-row button.active{color:#fff;background:var(--accent)}
.distraction{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  padding:9px 13px;
  border:1px solid var(--border);
  border-radius:999px;
  background:transparent;
  cursor:pointer;
}
.budget-bar{
  position:relative;
  height:15px;
  overflow:hidden;
  border-radius:99px;
  background:var(--surface-2);
}
.budget-bar span{display:block;height:100%;border-radius:inherit;background:var(--success)}

.breathe{
  display:grid;
  place-items:center;
  width:145px;
  height:145px;
  margin:20px auto;
  border-radius:50%;
  color:#fff;
  background:radial-gradient(circle,#a985ff,var(--accent));
  box-shadow:0 0 0 0 rgba(var(--accent-rgb),.18);
}
.breathe.running{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{
  0%,100%{transform:scale(.78);box-shadow:0 0 0 0 rgba(var(--accent-rgb),.20)}
  50%{transform:scale(1.08);box-shadow:0 0 0 25px rgba(var(--accent-rgb),0)}
}

.grade-table{width:100%;border-collapse:collapse}
.grade-table th,.grade-table td{padding:10px 7px;border-bottom:1px solid var(--border);text-align:left;font-size:.8rem}
.grade-number{
  display:inline-grid;
  place-items:center;
  width:34px;height:34px;
  border-radius:11px;
  color:#fff;
  font-weight:900;
}

.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}
.setting:last-child{border-bottom:0}
.setting strong{display:block;font-size:.87rem}
.setting span{color:var(--muted);font-size:.74rem}
.setting select{width:auto;min-width:125px}
.switch{
  position:relative;
  flex:0 0 auto;
  width:50px;height:29px;
}
.switch input{display:none}
.switch span{
  position:absolute;
  inset:0;
  border-radius:99px;
  background:#b8bdca;
  cursor:pointer;
  transition:.2s;
}
.switch span:after{
  content:"";
  position:absolute;
  top:4px;left:4px;
  width:21px;height:21px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:after{transform:translateX(21px)}

.sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:16px;
  background:rgba(7,10,20,.48);
  backdrop-filter:blur(5px);
  animation:fade .2s ease;
}
.sheet{
  width:min(640px,100%);
  max-height:min(88vh,900px);
  overflow:auto;
  padding:20px;
  border:1px solid var(--border);
  border-radius:28px 28px 20px 20px;
  background:var(--surface);
  box-shadow:0 25px 70px rgba(0,0,0,.3);
  animation:sheetUp .26s ease;
}
.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}
.sheet-head h2{margin:0}
.sheet-handle{
  width:48px;height:5px;
  margin:-8px auto 14px;
  border-radius:99px;
  background:var(--border);
}
@keyframes fade{from{opacity:0}}
@keyframes sheetUp{from{opacity:0;transform:translateY(30px)}}

.toast{
  position:fixed;
  left:50%;
  bottom:104px;
  z-index:200;
  max-width:calc(100% - 30px);
  padding:12px 17px;
  border-radius:15px;
  color:#fff;
  background:#20263a;
  box-shadow:var(--shadow);
  transform:translate(-50%,25px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}
.toast.show{transform:translate(-50%,0);opacity:1}

.confetti{
  position:fixed;
  z-index:300;
  width:9px;height:14px;
  border-radius:3px;
  pointer-events:none;
  animation:confetti .8s ease-out forwards;
}
@keyframes confetti{
  to{transform:translate(var(--x),var(--y)) rotate(640deg);opacity:0}
}

.focus-mode .topbar,.focus-mode .bottom-nav{display:none}
.focus-mode .app{width:100%;padding:12px;max-width:none}
.focus-mode #focusPanel{
  position:fixed;
  inset:0;
  z-index:80;
  overflow:auto;
  padding:18px;
  background:var(--bg);
}
.focus-mode .focus-layout{
  width:min(850px,100%);
  margin:auto;
  grid-template-columns:1fr;
}
.focus-mode .focus-side{display:none}

body.calm .xp-pill,body.calm .game-only{display:none!important}
body.large-targets .btn,body.large-targets button{min-height:48px}

@media(max-width:800px){
  .dashboard-grid,.focus-layout{grid-template-columns:1fr}
  .grid.three{grid-template-columns:1fr}
  .page-head{align-items:flex-start;flex-direction:column}
}
@media(max-width:580px){
  .app{padding-left:12px;padding-right:12px}
  .grid.two,.form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
  .rings{gap:5px}
  .ring{width:78px}
  .hero{padding:20px}
  .rating-grid{grid-template-columns:repeat(2,1fr)}
  .topbar{min-height:66px}
  .xp-pill{padding:7px 9px}
  .bottom-nav{border-radius:20px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{
  scroll-behavior:auto!important;
  animation-duration:.001ms!important;
  animation-iteration-count:1!important;
  transition-duration:.001ms!important;
}
@media print{
  .topbar,.bottom-nav,.btn,.icon-btn{display:none!important}
  .app{padding:0;width:100%}
  body{background:#fff;color:#000}
  .card{box-shadow:none}
}
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">F</div>
      <div>
        <strong>Fokus</strong>
        <span>Lernen. Verstehen. Schaffen.</span>
      </div>
    </div>

    <div class="top-actions">
      <div class="xp-pill game-only" id="xpPill">⭐ 0 XP</div>
      <button class="icon-btn" onclick="toggleTheme()" title="Hell/Dunkel" aria-label="Hell- oder Dunkelmodus">◐</button>
    </div>
  </header>

  <main id="view"></main>
</div>

<nav class="bottom-nav" aria-label="Hauptnavigation">
  <button class="nav-btn active" data-view="today"><span class="nav-icon">☀️</span>Heute</button>
  <button class="nav-btn" data-view="plan"><span class="nav-icon">🗓️</span>Plan</button>
  <button class="nav-btn" data-view="learn"><span class="nav-icon">🧠</span>Lernen</button>
  <button class="nav-btn" data-view="focus"><span class="nav-icon">🎯</span>Fokus</button>
  <button class="nav-btn" data-view="more"><span class="nav-icon">✨</span>Mehr</button>
</nav>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
"use strict";

const STORAGE_KEY = "fokus.lernapp.v1";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const esc = value => String(value ?? "")
  .replaceAll("&","&amp;").replaceAll("<","&lt;")
  .replaceAll(">","&gt;").replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

function iso(date=new Date()){
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseISO(value){
  if(!value) return new Date();
  const [y,m,d] = value.split("-").map(Number);
  return new Date(y,m-1,d,12);
}
function addDays(value,amount){
  const d = typeof value === "string" ? parseISO(value) : new Date(value);
  d.setDate(d.getDate()+amount);
  return iso(d);
}
function daysBetween(a,b){
  return Math.round((parseISO(b)-parseISO(a))/86400000);
}
function formatDate(value,options={day:"2-digit",month:"2-digit"}){
  return parseISO(value).toLocaleDateString("de-DE",options);
}
function mondayOf(value=iso()){
  const d = parseISO(value);
  const day = d.getDay() || 7;
  d.setDate(d.getDate()-day+1);
  return iso(d);
}
function weekKey(value=iso()){ return mondayOf(value); }
function dayName(value){
  return parseISO(value).toLocaleDateString("de-DE",{weekday:"short"});
}
function timeGreeting(){
  const h = new Date().getHours();
  if(h<11) return "Guten Morgen";
  if(h<17) return "Hallo";
  return "Guten Abend";
}

function defaultState(){
  return {
    version:1,
    profile:{
      name:"Schüler:in",
      why:"Ich lerne, um meine Ziele zu erreichen.",
      xp:0,
      onboarded:false
    },
    settings:{
      theme:"auto",
      accent:"purple",
      dailyGoal:90,
      calm:false,
      reduceMotion:false,
      largeTargets:false,
      fontScale:1,
      bedtime:"22:00",
      learnEnd:"21:00",
      tiktokLimit:30,
      focusPreset:25,
      writtenWeight:60
    },
    subjects:[
      {id:"mathe",name:"Mathematik",icon:"∑",color:"#6c5ce7"},
      {id:"deutsch",name:"Deutsch",icon:"A",color:"#e17055"},
      {id:"englisch",name:"Englisch",icon:"EN",color:"#0984e3"},
      {id:"geschichte",name:"Geschichte",icon:"⌛",color:"#d63031"},
      {id:"bio",name:"Biologie",icon:"🧬",color:"#00b894"},
      {id:"physik",name:"Physik",icon:"⚛",color:"#00a8ff"},
      {id:"chemie",name:"Chemie",icon:"⚗",color:"#e84393"}
    ],
    tasks:[],
    cards:[],
    errors:[],
    sessions:[],
    grades:[],
    timetable:[],
    checkins:{},
    tiktok:{},
    reviews:[],
    weeklyReviews:{},
    meta:{lastBackup:null,activeTimer:null}
  };
}

function loadState(){
  const base = defaultState();
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(!saved) return base;
    return {
      ...base,
      ...saved,
      profile:{...base.profile,...saved.profile},
      settings:{...base.settings,...saved.settings},
      meta:{...base.meta,...saved.meta},
      subjects:Array.isArray(saved.subjects)?saved.subjects:base.subjects,
      tasks:Array.isArray(saved.tasks)?saved.tasks:[],
      cards:Array.isArray(saved.cards)?saved.cards:[],
      errors:Array.isArray(saved.errors)?saved.errors:[],
      sessions:Array.isArray(saved.sessions)?saved.sessions:[],
      grades:Array.isArray(saved.grades)?saved.grades:[],
      timetable:Array.isArray(saved.timetable)?saved.timetable:[],
      reviews:Array.isArray(saved.reviews)?saved.reviews:[],
      checkins:saved.checkins||{},
      tiktok:saved.tiktok||{},
      weeklyReviews:saved.weeklyReviews||{}
    };
  }catch(error){
    console.error(error);
    return base;
  }
}

let state = loadState();
let currentView = "today";
let planTab = "week";
let learnTab = "overview";
let moreTab = "grades";
let weekOffset = 0;
let reviewQueue = [];
let reviewIndex = 0;
let cardFlipped = false;
let quiz = null;
let toastTimer = null;
let focusInterval = null;
let noiseSource = null;
let audioContext = null;

let timer = {
  running:false,
  remaining:state.settings.focusPreset*60,
  original:state.settings.focusPreset*60,
  end:0,
  goal:"",
  noPhone:false,
  distractions:0,
  mode:"focus"
};

function save(renderAfter=false){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  applySettings();
  updateTopbar();
  if(renderAfter) render();
}

function subject(id){
  return state.subjects.find(s=>s.id===id) || {id:"other",name:"Sonstiges",icon:"•",color:"#7f8c8d"};
}
function taskById(id){ return state.tasks.find(t=>t.id===id); }
function cardById(id){ return state.cards.find(c=>c.id===id); }

function applySettings(){
  let theme = state.settings.theme;
  if(theme==="auto"){
    theme = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = theme;

  const colors = {
    purple:["#6c5ce7","108,92,231"],
    blue:["#0984e3","9,132,227"],
    green:["#00a878","0,168,120"],
    orange:["#e67e22","230,126,34"],
    pink:["#e84393","232,67,147"]
  };
  const selected = colors[state.settings.accent] || colors.purple;
  document.documentElement.style.setProperty("--accent",selected[0]);
  document.documentElement.style.setProperty("--accent-rgb",selected[1]);
  document.documentElement.style.setProperty("--font-scale",state.settings.fontScale||1);
  document.body.classList.toggle("calm",!!state.settings.calm);
  document.body.classList.toggle("reduce-motion",!!state.settings.reduceMotion);
  document.body.classList.toggle("large-targets",!!state.settings.largeTargets);
  document.querySelector('meta[name="theme-color"]').content = selected[0];
}

function levelInfo(){
  const level = Math.floor((state.profile.xp||0)/250)+1;
  const titles = ["Starter","Entdecker","Dranbleiber","Lernprofi","Fokus-Meister","Wissens-Champion"];
  return {level,title:titles[Math.min(level-1,titles.length-1)]};
}
function updateTopbar(){
  const info = levelInfo();
  $("#xpPill").textContent = `⭐ ${state.profile.xp||0} XP · L${info.level}`;
}
function addXP(amount){
  if(state.settings.calm) return;
  const before = levelInfo().level;
  state.profile.xp = (state.profile.xp||0)+amount;
  if(levelInfo().level>before){
    confetti();
    toast(`Neues Level: ${levelInfo().title}!`);
  }
}



const EXTRA_CSS = [];

function addCSS(text){
  EXTRA_CSS.push(text);
}

function injectStyles(){
  const old = document.getElementById("fokus-extra-css");
  if (old) old.remove();
  const style = document.createElement("style");
  style.id = "fokus-extra-css";
  style.textContent = EXTRA_CSS.join("\n");
  document.head.appendChild(style);
}

/* ---------- Kleine Helfer für Formulare und Anzeige ---------- */

function option(value,label,selected){
  const same = String(value) === String(selected);
  return `<option value="${esc(value)}" ${same ? "selected" : ""}>${esc(label)}</option>`;
}

function subjectOptions(selected){
  return state.subjects.map(s => option(s.id,s.name,selected)).join("");
}

function subjectCheckboxes(selected = []){
  return `
    <div class="subject-picker">
      ${state.subjects.map(s => `
        <label class="chip-check">
          <input type="checkbox" name="subjectIds" value="${esc(s.id)}"
            ${selected.includes(s.id) ? "checked" : ""}>
          <span style="--chip:${s.color}">${esc(s.icon)} ${esc(s.name)}</span>
        </label>
      `).join("")}
    </div>`;
}

function fmt(value,digits = 2){
  if (value === null || value === undefined || Number.isNaN(Number(value))) return "–";
  return Number(value).toFixed(digits).replace(".",",");
}

function ring(label,value,max,text,color = "var(--accent)"){
  const percent = max ? clamp(Math.round(value / max * 100),0,100) : 0;
  return `
    <div class="ring-wrap">
      <div class="ring" style="--value:${percent}%;--ring-color:${color}">
        <strong>${esc(text)}</strong>
      </div>
      <div class="ring-label">${esc(label)}</div>
    </div>`;
}

/* ---------- Mehrere Fächer pro Aufgabe ---------- */

function taskSubjectIds(t){
  if (Array.isArray(t.subjectIds) && t.subjectIds.length) return t.subjectIds;
  return t.subjectId ? [t.subjectId] : [];
}

function taskSubjects(t){
  const list = taskSubjectIds(t).map(id => subject(id));
  return list.length ? list : [subject("")];
}

function taskSubjectLabel(t){
  return taskSubjects(t).map(s => s.name).join(" + ");
}

function taskColor(t){
  return taskSubjects(t)[0].color;
}

/* ---------- Notenpunkte (Oberstufe 0 bis 15) ---------- */

const GRADE_TABLE = [
  [15,"1+"],[14,"1"],[13,"1-"],
  [12,"2+"],[11,"2"],[10,"2-"],
  [9,"3+"],[8,"3"],[7,"3-"],
  [6,"4+"],[5,"4"],[4,"4-"],
  [3,"5+"],[2,"5"],[1,"5-"],
  [0,"6"]
];

function roundPoints(value){
  return clamp(Math.round(Number(value) || 0),0,15);
}

function pointsLabel(points){
  const p = roundPoints(points);
  const row = GRADE_TABLE.find(r => r[0] === p);
  return row ? row[1] : "–";
}

function pointsToClassic(points){
  /* Näherung für die klassische Notenskala 1 bis 6 */
  return 6 - roundPoints(points) / 3;
}

function pointsColor(points){
  const p = roundPoints(points);
  if (p >= 12) return "#00a878";
  if (p >= 9) return "#27ae60";
  if (p >= 5) return "#f39c12";
  return "#e74c3c";
}

/* ---------- Auswertung: Aktivität, Serien, Fokus ---------- */

function activityDates(){
  const dates = new Set();
  state.sessions.forEach(s => dates.add(s.date));
  state.reviews.forEach(r => dates.add(r.date));
  state.tasks.forEach(t => {
    if (t.completedAt) dates.add(t.completedAt.slice(0,10));
    (t.subtasks || []).forEach(st => {
      if (st.doneAt) dates.add(st.doneAt.slice(0,10));
    });
  });
  return dates;
}

function streak(){
  const dates = activityDates();
  let count = 0;
  let cursor = iso();
  if (!dates.has(cursor)) cursor = addDays(cursor,-1);
  while (dates.has(cursor) && count < 3650) {
    count++;
    cursor = addDays(cursor,-1);
  }
  return count;
}

function focusMinutes(date = iso()){
  return Math.round(
    state.sessions
      .filter(s => s.date === date)
      .reduce((sum,s) => sum + (Number(s.minutes) || 0), 0)
  );
}

function reviewsToday(){
  return state.reviews.filter(r => r.date === iso()).length;
}

function completedToday(){
  let total = 0;
  state.tasks.forEach(t => {
    if ((t.completedAt || "").slice(0,10) === iso()) total++;
    (t.subtasks || []).forEach(st => {
      if ((st.doneAt || "").slice(0,10) === iso()) total++;
    });
  });
  return total;
}

function dailyCapacity(){
  const check = state.checkins[iso()] || {};
  let factor = 1;
  if (check.energy === "mued") factor = .65;
  if (Number(check.sleepHours) > 0 && Number(check.sleepHours) < 6) {
    factor = Math.min(factor,.65);
  }
  return Math.round(state.settings.dailyGoal * factor);
}

function dueCards(){
  return state.cards.filter(c => (c.due || iso()) <= iso());
}

function subjectScore(id){
  const cards = state.cards.filter(c => c.subjectId === id);
  const tasks = state.tasks.filter(t => taskSubjectIds(t).includes(id));
  if (!cards.length && !tasks.length) return 0;

  const cardScore = cards.length
    ? cards.reduce((sum,c) => sum + clamp((c.reps || 0) * 22,0,100),0) / cards.length
    : 0;

  let taskDone = 0;
  let taskTotal = 0;

  tasks.forEach(t => {
    if ((t.subtasks || []).length) {
      taskTotal += t.subtasks.length;
      taskDone += t.subtasks.filter(s => s.done).length;
    } else {
      taskTotal++;
      if (t.completed) taskDone++;
    }
  });

  const taskScore = taskTotal ? taskDone / taskTotal * 100 : 0;

  if (cards.length && taskTotal) {
    return Math.round(cardScore * .65 + taskScore * .35);
  }
  return Math.round(cards.length ? cardScore : taskScore);
}

/* ---------- Nächste Schritte ---------- */

function nextActions(){
  const items = [];

  state.tasks.filter(t => !t.completed).forEach(t => {
    const open = (t.subtasks || [])
      .filter(s => !s.done)
      .sort((a,b) => (a.date || t.due).localeCompare(b.date || t.due));

    if (open.length) {
      const step = open[0];
      items.push({
        taskId: t.id,
        stepId: step.id,
        title: step.title,
        subtitle: `${taskSubjectLabel(t)} · ${formatDate(step.date || t.due)}`,
        date: step.date || t.due,
        priority: t.priority || "medium",
        color: taskColor(t)
      });
    } else {
      items.push({
        taskId: t.id,
        stepId: null,
        title: t.title,
        subtitle: `${taskSubjectLabel(t)} · fällig ${formatDate(t.due)}`,
        date: t.due,
        priority: t.priority || "medium",
        color: taskColor(t)
      });
    }
  });

  const order = {high:0,medium:1,low:2};

  return items.sort((a,b) => {
    const overdueA = a.date <= iso() ? 0 : 1;
    const overdueB = b.date <= iso() ? 0 : 1;
    return overdueA - overdueB ||
      a.date.localeCompare(b.date) ||
      order[a.priority] - order[b.priority];
  });
}

/* ---------- Prüfungen (Grundlage für Teil 5) ---------- */

function examTasks(){
  return state.tasks
    .filter(t => ["exam","test"].includes(t.type) && !t.completed)
    .sort(taskSort);
}

/* ---------- Hinweise für das Lernen ---------- */

function learningWarnings(){
  const warnings = [];
  const today = iso();
  const next7 = addDays(today,6);
  const planned = {};

  state.tasks.filter(t => !t.completed).forEach(t => {
    (t.subtasks || []).filter(s => !s.done).forEach(s => {
      const date = s.date || t.due;
      if (date >= today && date <= next7) {
        planned[date] = (planned[date] || 0) + (Number(s.duration) || 25);
      }
    });
  });

  const overloaded = Object.entries(planned)
    .find(([,minutes]) => minutes > dailyCapacity() * .85);

  if (overloaded) {
    warnings.push({
      icon: "⚠️",
      title: "Voller Lerntag erkannt",
      text: `Am ${formatDate(overloaded[0])} sind ${overloaded[1]} Minuten geplant. Plane etwas Puffer ein.`
    });
  }

  const cramming = state.tasks.find(t => {
    if (t.completed) return false;
    const days = daysBetween(today,t.due);
    if (days < 0 || days > 14) return false;
    const open = (t.subtasks || []).filter(s => !s.done);
    if (open.length < 2) return false;
    const late = open.filter(s => daysBetween(s.date || t.due,t.due) <= 1).length;
    return late / open.length > .5;
  });

  if (cramming) {
    warnings.push({
      icon: "📚",
      title: "Nicht alles am letzten Tag",
      text: `Verteile „${cramming.title}“ früher. Kurze Wiederholungen über mehrere Tage wirken besser.`
    });
  }

  const check = state.checkins[today];
  if (check && Number(check.sleepHours) > 0 && Number(check.sleepHours) < 6) {
    warnings.push({
      icon: "🌙",
      title: "Heute etwas leichter",
      text: "Du hast wenig Schlaf eingetragen. Wiederhole Bekanntes und lerne keine riesige neue Einheit."
    });
  }

  const exam = examTasks()[0];
  if (exam) {
    const topics = exam.topics || [];
    const confirmed = topics.filter(t => t.confirmed);
    const unconfirmed = topics.filter(t => !t.confirmed);

    if (!confirmed.length) {
      warnings.unshift({
        icon: "📝",
        title: "Prüfungsstoff noch nicht erfasst",
        text: `Für „${exam.title}“ fehlen bestätigte Themen. Übernimm die Stoffliste im Prüfungs-Cockpit.`
      });
    } else if (unconfirmed.length) {
      warnings.unshift({
        icon: "🤖",
        title: "KI-Vorschläge prüfen",
        text: `${unconfirmed.length} Vorschlag/Vorschläge sind noch nicht als Prüfungsstoff bestätigt.`
      });
    }
  }

  return warnings.slice(0,3);
}

/* ---------- Datenmigration (alte Versionen weiter nutzbar) ---------- */

function normalizeTopic(topic){
  return {
    id: topic.id || uid(),
    name: String(topic.name || "Thema"),
    objective: topic.objective || "",
    material: topic.material || "",
    importance: clamp(Number(topic.importance) || 3,1,5),
    confidence: clamp(Number(topic.confidence) || 1,1,5),
    minutes: clamp(Number(topic.minutes) || 30,10,600),
    source: topic.source || "manual",
    confirmed: topic.confirmed !== false,
    lastScore: (topic.lastScore === undefined || topic.lastScore === "") ? null : topic.lastScore,
    createdAt: topic.createdAt || new Date().toISOString()
  };
}

function normalizeTask(t){
  t.subjectIds = taskSubjectIds(t);
  t.subjectId = t.subjectIds[0] || t.subjectId || "mathe";
  t.topics = Array.isArray(t.topics) ? t.topics.map(normalizeTopic) : [];
  t.subtasks = Array.isArray(t.subtasks) ? t.subtasks : [];
  t.priority = t.priority || "medium";
  t.repeat = t.repeat || "none";
  t.duration = Number(t.duration) || 120;
  t.notes = t.notes || "";
  t.ifThen = t.ifThen || "";
  t.syllabus = t.syllabus || "";
  return t;
}

function normalizeGrade(g){
  let points = g.points;
  if (points === undefined || points === null || points === "") {
    const old = Number(g.value);
    points = Number.isFinite(old) ? clamp(Math.round((6 - old) * 3),0,15) : 0;
  }
  return {
    id: g.id || uid(),
    subjectId: g.subjectId || "mathe",
    points: roundPoints(points),
    kind: g.kind === "oral" ? "oral" : "written",
    date: g.date || iso(),
    label: g.label || ""
  };
}

function migrateState(){
  state.ai = {
    mode: "proxy",
    endpoint: "",
    model: "",
    consent: false,
    examId: "",
    ...(state.ai || {})
  };

  if (!Array.isArray(state.coachMessages)) state.coachMessages = [];
  if (!Array.isArray(state.settings.customTimers)) state.settings.customTimers = [];
  if (!["points","classic"].includes(state.settings.gradeScale)) {
    state.settings.gradeScale = "points";
  }

  state.settings.writtenWeight = clamp(Number(state.settings.writtenWeight) || 60,0,100);
  state.subjects = Array.isArray(state.subjects) ? state.subjects : defaultState().subjects;
  state.tasks = state.tasks.map(normalizeTask);
  state.grades = state.grades.map(normalizeGrade);
  state.cards = state.cards.map(c => ({...c, subjectId: c.subjectId || "mathe"}));
  state.meta = {...defaultState().meta, ...(state.meta || {})};
  if (!state.meta.sequence) state.meta.sequence = null;
}

/* ---------- Benachrichtigungen, Töne, Export ---------- */

function toast(message){
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"),2600);
}

function vibrate(pattern){
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function beep(times = 3){
  try {
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === "suspended") audioContext.resume();

    for (let i = 0; i < times; i++) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const start = audioContext.currentTime + i * .38;

      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.18,start + .02);
      gain.gain.exponentialRampToValueAtTime(.0001,start + .28);

      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(start);
      osc.stop(start + .3);
    }
  } catch (error) {
    console.warn("Ton nicht verfügbar", error);
  }
}

function confetti(){
  if (state.settings.reduceMotion) return;
  const colors = ["#6c5ce7","#00b894","#fdcb6e","#e84393","#0984e3"];

  for (let i = 0; i < 32; i++) {
    const piece = document.createElement("i");
    piece.className = "confetti";
    piece.style.left = `${50 + Math.random() * 8 - 4}%`;
    piece.style.top = "45%";
    piece.style.background = colors[i % colors.length];
    piece.style.setProperty("--x",`${(Math.random() - .5) * 500}px`);
    piece.style.setProperty("--y",`${Math.random() * 420 - 180}px`);
    piece.style.animationDelay = `${Math.random() * .12}s`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(),1000);
  }
}

function download(name,content,type){
  const blob = new Blob([content],{type:`${type};charset=utf-8`});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url),500);
}

/* ---------- Lernschritte automatisch erzeugen ---------- */

function buildSteps(type,totalMinutes = 120){
  const map = {
    exam:["Stoff und Unterlagen sammeln","Wissen aktiv abfragen","Gemischte Übungsaufgaben","Probeklausur bearbeiten","Fehler gezielt wiederholen"],
    test:["Stoff überblicken","Kernbegriffe abfragen","Übungsaufgaben lösen","Kurze Selbstprüfung"],
    homework:["Aufgabe verstehen","Aufgabe bearbeiten","Ergebnis kontrollieren"],
    project:["Thema und Anforderungen klären","Recherche","Gliederung erstellen","Ausarbeitung","Überarbeiten und abgeben"],
    presentation:["Recherche","Gliederung","Folien und Handout","Quellen prüfen","Probelauf"],
    practice:["Material vorbereiten","Aktiv üben","Fehler prüfen"]
  };
  const names = map[type] || map.practice;
  const each = Math.max(10,Math.round(totalMinutes / names.length / 5) * 5);
  return names.map(title => ({
    id:uid(),
    title,
    duration:each,
    date:iso(),
    done:false,
    doneAt:null,
    manualDate:false
  }));
}

/* Verteilt offene, nicht manuell gesetzte Schritte gleichmäßig bis zur Frist. */
function scheduleTask(t){
  const open = (t.subtasks || []).filter(s => !s.done && !s.manualDate);
  if (!open.length) return;

  const today = iso();
  const lastDay = t.due > today ? addDays(t.due,-1) : today;
  const span = Math.max(0,daysBetween(today,lastDay));

  open.forEach((st,index) => {
    const ratio = open.length <= 1 ? 0 : index / (open.length - 1);
    st.date = addDays(today,Math.round(ratio * span));
  });
}

function toggleSubtask(taskId,stepId){
  const t = taskById(taskId);
  const st = t?.subtasks?.find(s => s.id === stepId);
  if (!st) return;

  st.done = !st.done;
  st.doneAt = st.done ? new Date().toISOString() : null;

  if (st.done) {
    addXP(6);
    vibrate(20);
  }

  save();
  render();
}

/* ---------- Aufgabe erledigen, verschieben, wiederholen ---------- */

function toggleTask(id){
  const t = taskById(id);
  if (!t) return;

  t.completed = !t.completed;
  t.completedAt = t.completed ? new Date().toISOString() : null;

  if (t.completed) {
    (t.subtasks || []).forEach(st => {
      if (!st.done) {
        st.done = true;
        st.doneAt = new Date().toISOString();
      }
    });

    addXP(20);
    vibrate(30);
    checkDailyCelebration();

    if (t.repeat === "weekly") {
      const clone = JSON.parse(JSON.stringify(t));
      clone.id = uid();
      clone.due = addDays(t.due,7);
      clone.completed = false;
      clone.completedAt = null;
      clone.createdAt = new Date().toISOString();
      clone.subtasks = (clone.subtasks || []).map(st => ({
        ...st,
        id:uid(),
        done:false,
        doneAt:null,
        manualDate:false
      }));
      scheduleTask(clone);
      state.tasks.push(clone);
    }
  }

  save();
  render();
}

function completeAction(taskId,stepId){
  if (stepId) toggleSubtask(taskId,stepId);
  else toggleTask(taskId);
}

function moveTask(id){
  const t = taskById(id);
  if (!t) return;

  if (t.due <= iso()) {
    toast("Die Frist ist heute oder schon vorbei. Ändere zuerst das Fälligkeitsdatum.");
    return;
  }

  const open = (t.subtasks || []).filter(s => !s.done);
  if (!open.length) {
    toast("Keine offenen Schritte zum Verschieben.");
    return;
  }

  open.forEach(st => {
    const base = st.date && st.date > iso() ? st.date : iso();
    const next = addDays(base,1);
    st.date = next > t.due ? t.due : next;
    st.manualDate = true;
  });

  save();
  render();
  toast("Offene Schritte wurden um einen Tag verschoben.");
}

function autoPlanAll(){
  state.tasks.filter(t => !t.completed).forEach(t => {
    (t.subtasks || []).forEach(st => {
      if (!st.done) st.manualDate = false;
    });
    scheduleTask(t);
  });

  save();
  render();
  toast("Alle offenen Aufgaben wurden neu verteilt.");
}

/* ---------- Schnelleingabe ---------- */

function quickAddTask(){
  const input = $("#quickTask");
  const text = input?.value.trim();
  if (!text) return;

  const lower = text.toLowerCase();

  const aliases = {
    mathe:"mathe", mathematik:"mathe",
    deutsch:"deutsch",
    englisch:"englisch", english:"englisch",
    geschichte:"geschichte",
    bio:"bio", biologie:"bio",
    physik:"physik",
    chemie:"chemie"
  };

  const found = new Set();

  Object.entries(aliases).forEach(([word,id]) => {
    if (lower.includes(word)) found.add(id);
  });

  state.subjects.forEach(s => {
    if (lower.includes(s.name.toLowerCase())) found.add(s.id);
  });

  const subjectIds = found.size ? [...found] : [state.subjects[0].id];

  let type = "homework";
  if (lower.includes("klausur")) type = "exam";
  else if (lower.includes("test")) type = "test";
  else if (lower.includes("referat")) type = "presentation";
  else if (lower.includes("projekt")) type = "project";
  else if (lower.includes("übung")) type = "practice";

  let due = addDays(iso(),7);
  if (lower.includes("morgen")) due = addDays(iso(),1);
  else if (lower.includes("übermorgen")) due = addDays(iso(),2);

  const match = text.match(/(\d{1,2})[.\-/](\d{1,2})(?:[.\-/](\d{2,4}))?/);
  if (match) {
    let year = match[3] ? Number(match[3]) : new Date().getFullYear();
    if (year < 100) year += 2000;
    const candidate = iso(new Date(year,Number(match[2]) - 1,Number(match[1]),12));
    due = candidate < iso() && !match[3]
      ? iso(new Date(year + 1,Number(match[2]) - 1,Number(match[1]),12))
      : candidate;
  }

  const duration = type === "exam" ? 240 : type === "test" ? 150 : 75;

  const t = {
    id:uid(),
    title:text,
    subjectIds,
    subjectId:subjectIds[0],
    type,
    due,
    priority:type === "exam" || type === "test" ? "high" : "medium",
    duration,
    repeat:"none",
    completed:false,
    completedAt:null,
    createdAt:new Date().toISOString(),
    notes:"",
    ifThen:"Wenn ich nach Hause komme, starte ich den ersten Lernschritt.",
    topics:[],
    syllabus:"",
    subtasks:buildSteps(type,duration)
  };

  scheduleTask(t);
  state.tasks.push(t);
  addXP(5);
  save();
  renderPlan();
  toast(`Erkannt: ${subjectIds.map(id => subject(id).name).join(" + ")}, ${typeLabel(type)}.`);
}

function dayColumnHTML(date,index){
  const lessons = state.timetable
    .filter(l => Number(l.day) === index + 1)
    .sort((a,b) => String(a.start).localeCompare(String(b.start)));

  const items = [];

  state.tasks.filter(t => !t.completed).forEach(t => {
    const steps = t.subtasks || [];
    if (steps.length) {
      steps.forEach(st => {
        if ((st.date || t.due) === date) items.push({task:t,step:st});
      });
    } else if (t.due === date) {
      items.push({task:t,step:null});
    }
  });

  const minutes = items
    .filter(i => !(i.step ? i.step.done : i.task.completed))
    .reduce((sum,i) => sum + Number(i.step ? i.step.duration : i.task.duration || 0),0);

  return `
    <section class="day-column ${date === iso() ? "today" : ""}">
      <div class="day-head">
        <strong>${dayName(date)}${date === iso() ? " · heute" : ""}</strong>
        <span>${formatDate(date)}</span>
      </div>

      ${lessons.map(l => `
        <div class="lesson-chip">
          ${esc(l.start)} · ${esc(subject(l.subjectId).name)}${l.room ? ` · ${esc(l.room)}` : ""}
        </div>`).join("")}

      ${items.map(({task,step}) => {
        const done = step ? step.done : task.completed;
        const action = step
          ? `toggleSubtask('${task.id}','${step.id}')`
          : `toggleTask('${task.id}')`;

        return `
          <button class="plan-chip ${done ? "done" : ""}"
            style="border-left-color:${taskColor(task)}"
            onclick="${action}">
            <strong>${esc(step ? step.title : task.title)}</strong><br>
            <span class="muted">${esc(taskSubjectLabel(task))} · ${step ? step.duration : task.duration} Min.</span>
          </button>`;
      }).join("")}

      ${minutes ? `<div class="day-sum">Geplant: ${minutes} Min.</div>` : ""}

      ${!lessons.length && !items.length
        ? `<div class="small muted">Noch frei</div>`
        : ""}
    </section>`;
}

function renderTaskList(){
  const open = state.tasks.filter(t => !t.completed).sort(taskSort);

  $("#planContent").innerHTML = `
    <div class="quick-input">
      <input id="quickTask"
        placeholder='z. B. „Englisch Hausaufgabe morgen“'
        onkeydown="if(event.key==='Enter')quickAddTask()">
      <button class="btn primary" onclick="quickAddTask()">Eintragen</button>

function taskHTML(t){
  const color = taskColor(t);
  const days = daysBetween(iso(),t.due);
  const deadline = days < 0
    ? `${Math.abs(days)} T. überfällig`
    : days === 0 ? "Heute fällig"
    : days === 1 ? "Morgen fällig"
    : `Noch ${days} Tage`;
  const urgency = days <= 1 ? "red" : days <= 4 ? "orange" : "green";

  const steps = t.subtasks || [];
  const doneSteps = steps.filter(s => s.done).length;
  const openSteps = steps.length - doneSteps;

  return `
    <article class="task ${t.completed ? "done" : ""}" data-task="${t.id}">
      <div class="task-top">
        <div class="task-color" style="background:${color}"></div>

        <div class="task-main">
          <div class="task-title">${esc(t.title)}</div>

          <div class="task-subjects" style="margin-top:7px">
            ${taskSubjects(t).map(s => `
              <span class="subject-tag" style="background:${s.color}">
                ${esc(s.icon)} ${esc(s.name)}
              </span>`).join("")}
          </div>

          <div class="task-meta">
            <span>${esc(typeLabel(t.type))}</span>
            <span>•</span>
            <span class="badge ${urgency}">${deadline}</span>
            <span class="priority-${t.priority || "medium"}">● ${priorityLabel(t.priority)}</span>
            <span>${t.duration} Min. geplant</span>
          </div>

          ${steps.length
            ? `<div class="small muted" style="margin-top:7px">${doneSteps}/${steps.length} Schritte erledigt</div>`
            : ""}
        </div>

        <div class="task-actions">
          ${openSteps
            ? `<button class="circle-btn" onclick="startTaskSequence('${t.id}')"
                title="Mit Timer starten" aria-label="Mit Timer starten">⏱</button>`
            : ""}
          <button class="circle-btn" onclick="moveTask('${t.id}')"
            title="Auf morgen verschieben" aria-label="Verschieben">→</button>
          <button class="circle-btn" onclick="openTaskForm('${t.id}')"
            title="Bearbeiten" aria-label="Bearbeiten">✎</button>
          <button class="circle-btn" onclick="toggleTask('${t.id}')"
            title="Erledigen" aria-label="Erledigen">✓</button>
        </div>
      </div>

      ${steps.length ? `
        <div class="subtasks">
          ${steps.map(st => `
            <div class="step-row ${st.done ? "done" : ""}">
              <input type="checkbox" ${st.done ? "checked" : ""}
                onchange="toggleSubtask('${t.id}','${st.id}')"
                aria-label="Schritt erledigt">
              <span class="step-title">
                ${esc(st.title)} · ${formatDate(st.date || t.due)} · ${st.duration || 10} Min.
              </span>
              <button class="circle-btn step-mini" onclick="openStepForm('${t.id}','${st.id}')"
                aria-label="Schritt bearbeiten">✎</button>
            </div>`).join("")}
          <div class="inline-actions">
            <button class="btn small ghost" onclick="openStepForm('${t.id}')">＋ Eigener Schritt</button>
          </div>
        </div>` : `
        <div class="inline-actions">
          <button class="btn small ghost" onclick="openStepForm('${t.id}')">＋ Schritt</button>
        </div>`}
    </article>`;
}

function bindTaskSwipe(){
  $$(".task[data-task]").forEach(el => {
    let startX = 0;
    let startY = 0;

    el.addEventListener("touchstart",e => {
      startX = e.changedTouches[0].clientX;
      startY = e.changedTouches[0].clientY;
    },{passive:true});

    el.addEventListener("touchend",e => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;

      if (Math.abs(dx) > 85 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx > 0) toggleTask(el.dataset.task);
        else moveTask(el.dataset.task);
      }
    },{passive:true});
  });
}

const CARD_STEPS = [1,3,7,14,30];
const RATING_LABEL = {again:"Nochmal",hard:"Schwer",good:"Gut",easy:"Leicht"};

function cardStatusInfo(c){
  const reps = Number(c.reps || 0);
  const due = c.due || iso();
  if (!reps && due <= iso()) return {label:"Neu",color:"var(--accent)"};
  if (due < iso()) return {label:"Überfällig",color:"var(--danger)"};
  if (reps < 3) return {label:"Lernend",color:"var(--warning)"};
  return {label:"Sicher",color:"var(--success)"};
}

function clozeText(raw){
  return String(raw || "").replace(/\{\{(.*?)\}\}/g,(_,word) => word);
}

function clozeQuestionHTML(raw){
  return esc(String(raw || "")).replace(/\{\{(.*?)\}\}/g,
    '<span class="cloze-blank">Lücke</span>');
}

function clozeAnswerHTML(raw){
  return esc(String(raw || "")).replace(/\{\{(.*?)\}\}/g,
    '<span class="cloze-filled">$1</span>');
}

function cardQuestion(c){
  return c.type === "cloze"
    ? clozeQuestionHTML(c.question)
    : esc(c.question);
}

function cardAnswer(c){
  return c.type === "cloze"
    ? clozeAnswerHTML(c.question)
    : esc(c.answer);
}

function cardPlainAnswer(c){
  return c.type === "cloze"
    ? clozeText(c.question)
    : String(c.answer || "");
}

/* ---------- Vier Antwortstufen mit Wiederholungsplan ---------- */

function rateCard(rating){
  const c = cardById(reviewQueue[reviewIndex]);
  if (!c) return;

  c.ease = Number(c.ease) || 2.5;
  c.interval = Number(c.interval) || 0;
  c.reps = Number(c.reps) || 0;

  if (rating === "again") {
    c.reps = 0;
    c.interval = 1;
    c.ease = Math.max(1.3,c.ease - .2);
    addCardError(c);
  } else if (rating === "hard") {
    c.reps++;
    c.interval = Math.max(1,Math.round((c.interval || 1) * 1.2));
    c.ease = Math.max(1.3,c.ease - .15);
  } else if (rating === "good") {
    c.reps++;
    c.interval = c.reps === 1 ? 1 : c.reps === 2 ? 3 : Math.max(4,Math.round(c.interval * c.ease));
  } else {
    c.reps++;
    c.interval = c.reps === 1 ? 4 : Math.max(6,Math.round((c.interval || 2) * (c.ease + .35)));
    c.ease = Math.min(3.2,c.ease + .12);
  }

  c.due = addDays(iso(),c.interval);
  c.lastRating = rating;

  state.reviews.push({
    id:uid(),
    cardId:c.id,
    date:iso(),
    rating
  });

  addXP(rating === "again" ? 2 : rating === "hard" ? 4 : rating === "good" ? 7 : 9);

  reviewIndex++;
  cardFlipped = false;
  save();

  if (reviewIndex >= reviewQueue.length) {
    const count = reviewQueue.length;
    reviewQueue = [];
    reviewIndex = 0;
    renderCards();
    confetti();
    toast(`${count} Karten wiederholt.`);
  } else {
    renderCards();
  }
}

function renderQuiz(){
  const root = $("#learnContent");

  if (!state.cards.length) {
    root.innerHTML = `
      <div class="card empty">
        <span class="empty-icon">❓</span>
        Für das Quiz brauchst du mindestens eine Lernkarte.
      </div>`;
    return;
  }

  if (!quiz || !cardById(quiz.cardId)) newQuiz(false);

  const c = cardById(quiz.cardId);

  root.innerHTML = `
    <section class="card pad">
      <div class="section-title">
        <h2>Quiz aus deinen Karten</h2>
        <span class="badge">${esc(subject(c.subjectId).name)}</span>
      </div>

      <h2 style="line-height:1.4;font-size:1.1rem">${cardQuestion(c)}</h2>

      <div class="quiz-options">
        ${quiz.options.map((answer,index) => {
          let cls = "";
          if (quiz.answered) {
            if (index === quiz.correct) cls = "correct";
            else if (index === quiz.selected) cls = "wrong";
          }
          return `
            <button class="quiz-option ${cls}" ${quiz.answered ? "disabled" : ""}
              onclick="answerQuiz(${index})">${esc(answer)}</button>`;
        }).join("")}
      </div>

      ${quiz.answered ? `
        <div style="margin-top:15px">
          <strong>${quiz.selected === quiz.correct ? "Richtig! 🎉" : "Noch nicht richtig."}</strong>
          <p class="muted">Richtige Antwort: ${esc(cardPlainAnswer(c))}</p>
          <button class="btn primary" onclick="newQuiz()">Nächste Frage</button>
        </div>` : `
        <p class="quiz-hint">Tipp: Überlege zuerst selbst, bevor du antwortest.</p>`}
    </section>`;
}

function newQuiz(renderNow = true){
  if (!state.cards.length) {
    quiz = null;
    if (renderNow) renderQuiz();
    return;
  }

  const card = state.cards[Math.floor(Math.random() * state.cards.length)];
  const correct = cardPlainAnswer(card).trim() || "–";

  let wrong = state.cards
    .filter(c => c.id !== card.id)
    .map(c => cardPlainAnswer(c).trim())
    .filter(text => text && text !== correct);

  wrong = [...new Set(wrong)].sort(() => Math.random() - .5).slice(0,3);

  const fillers = ["Keine der Antworten","Das Gegenteil","Nicht eindeutig"];
  let fi = 0;
  while (wrong.length < 3) wrong.push(fillers[fi++ % fillers.length]);

  const options = [correct,...wrong].sort(() => Math.random() - .5);

  quiz = {
    cardId:card.id,
    options,
    correct:options.indexOf(correct),
    selected:null,
    answered:false
  };

  if (renderNow) renderQuiz();
}

function answerQuiz(index){
  if (!quiz || quiz.answered) return;

  quiz.selected = index;
  quiz.answered = true;

  if (index === quiz.correct) {
    addXP(5);
    save();
  } else {
    addCardError(cardById(quiz.cardId));
    save();
  }

  renderQuiz();
}

function reviewError(id,known){
  const e = state.errors.find(x => x.id === id);
  if (!e) return;

  if (!known) {
    e.stage = 0;
    e.nextDue = addDays(iso(),ERROR_INTERVALS[0]);
  } else {
    e.stage = (e.stage || 0) + 1;
    if (e.stage >= ERROR_INTERVALS.length) {
      state.errors = state.errors.filter(x => x.id !== id);
      toast("Fehler gemeistert und aus dem Fehlerheft entfernt.");
    } else {
      e.nextDue = addDays(iso(),ERROR_INTERVALS[e.stage]);
    }
    addXP(5);
  }

  save();
  renderErrors();
}

function topicsOf(exam){
  exam.topics = Array.isArray(exam.topics) ? exam.topics : [];
  return exam.topics;
}

function makeTopic(data = {}){
  return normalizeTopic({...data,id:uid(),lastScore:data.lastScore ?? null});
}

function topicHasTest(topic){
  return topic.lastScore !== null && topic.lastScore !== undefined && topic.lastScore !== "";
}

/*
 * Bereitschaft: Ohne echten Selbsttest zählt nur das Gefühl (maximal 70 %).
 * Ein Selbsttest zählt stärker, damit Einschätzung und Wissen zusammenpassen.
 */
function topicReadiness(topic){
  const confidence = clamp(((Number(topic.confidence) || 1) - 1) / 4 * 100,0,100);
  if (!topicHasTest(topic)) return Math.round(confidence * .7);
  return Math.round(confidence * .35 + clamp(Number(topic.lastScore),0,100) * .65);
}

function confirmedTopics(exam){
  return topicsOf(exam).filter(t => t.confirmed);
}

function examReadiness(exam){
  const topics = confirmedTopics(exam);
  if (!topics.length) return 0;
  const totalWeight = topics.reduce((sum,t) => sum + (Number(t.importance) || 3),0);
  const sum = topics.reduce((acc,t) => acc + topicReadiness(t) * (Number(t.importance) || 3),0);
  return Math.round(sum / Math.max(1,totalWeight));
}

function examStats(exam){
  const topics = confirmedTopics(exam);
  const readiness = topics.map(t => topicReadiness(t));
  return {
    total:topics.length,
    sure:readiness.filter(r => r >= 75).length,
    unsure:readiness.filter(r => r < 45).length,
    untested:topics.filter(t => !topicHasTest(t)).length,
    tested:topics.filter(t => topicHasTest(t)).length,
    minutes:topics.reduce((sum,t) => sum + (Number(t.minutes) || 0),0),
    readiness:examReadiness(exam)
  };
}

function readinessClass(value){
  if (value < 45) return "readiness-low";
  if (value < 75) return "readiness-mid";
  return "readiness-high";
}

function readinessColor(value){
  if (value < 45) return "var(--danger)";
  if (value < 75) return "var(--warning)";
  return "var(--success)";
}

function sourceLabel(source){

}

/*
 * Erkennt Formate wie:
 * Quadratische Funktionen
 * - Nullstellen | 5 | 2 | 60
 * 1. Scheitelpunktform | 4 | 1 | 45
 */
function parseTopicLine(line){
  const cleaned = String(line || "")
    .replace(/^\s*(?:[-*•▪–—]|\d+[.)])\s*/,"")
    .trim();

  const parts = cleaned.split(/\s*\|\s*/).map(x => x.trim());
  const name = (parts[0] || "")
    .replace(/^(themen?|stoff|inhalte?)\s*:\s*/i,"")
    .trim();

  return {
    name,
    importance:parts[1] ? clamp(Number(parts[1]) || 3,1,5) : 3,
    confidence:parts[2] ? clamp(Number(parts[2]) || 1,1,5) : 1,
    minutes:parts[3] ? clamp(Number(parts[3]) || 30,10,600) : null
  };
}

function addTopicsFromLines(exam,lines,source,confirmed){
  const topics = topicsOf(exam);
  const existing = new Set(topics.map(t => t.name.trim().toLowerCase()));
  let added = 0;
  let lastTopic = null;

  lines.forEach(raw => {
    const line = String(raw || "").trim();
    if (!line) return;

    /* Seitenangaben gehören zum Thema darüber */
    if (/(^|\s)(seiten?|s\.)\s*\d/i.test(line) && !line.includes("|")) {
      if (lastTopic) {
        lastTopic.material = [lastTopic.material,line].filter(Boolean).join("; ");
      }
      return;
    }

    const p = parseTopicLine(line);
    if (p.name.length < 2) return;

    const key = p.name.toLowerCase();

    if (existing.has(key)) {
      lastTopic = topics.find(t => t.name.trim().toLowerCase() === key) || null;
      return;
    }

    const topic = makeTopic({
      name:p.name,
      importance:p.importance,
      confidence:p.confidence,
      minutes:p.minutes || 30,
      source,
      confirmed
    });

    topics.push(topic);
    existing.add(key);
    lastTopic = topic;
    added++;
  });

  return added;
}

function extractTopicsFromSyllabus(examId){
  const exam = taskById(examId);
  if (!exam) return;

  const text = ($("#examSyllabus")?.value ?? exam.syllabus ?? "").trim();
  if (!text) {
    toast("Füge zuerst eine Stoffliste ein.");
    return;
  }

  exam.syllabus = text;

  let lines = text.split(/\n/);
  if (lines.length === 1) lines = text.split(/[;•]/);

  const added = addTopicsFromLines(exam,lines.slice(0,80),"material",true);

  save();
  renderExamCenter();
  toast(added ? `${added} Thema/Themen aus der Stoffliste übernommen.` : "Keine neuen Themen erkannt.");
}

/* ---------- Selbsttest mit Neuplanung ---------- */

function recordTopicTest(examId,topicId){
  const exam = taskById(examId);
  const topic = topicsOf(exam || {}).find(t => t.id === topicId);
  if (!topic) return;

  const value = prompt(
    `Wie viel Prozent konntest du bei „${topic.name}“ ohne Unterlagen richtig beantworten? (0 bis 100)`,
    topic.lastScore ?? 50
  );
  if (value === null) return;

  const score = clamp(Number(value) || 0,0,100);
  topic.lastScore = score;
  topic.lastTestAt = new Date().toISOString();

  if (score >= 80) {
    topic.confidence = Math.max(Number(topic.confidence) || 1,4);
    addXP(8);
  } else if (score >= 60) {
    topic.confidence = Math.max(Number(topic.confidence) || 1,3);
    addXP(5);
  } else {
    topic.confidence = Math.min(Number(topic.confidence) || 2,2);
    addXP(2);
  }

  if (score < 60) {
    /* Schwache Themen bekommen automatisch mehr Zeit */
    autoPlanTopics(examId,true);
    toast("Schwaches Ergebnis: Das Thema bekommt im Lernplan mehr Zeit.");
  } else {
    save();
    toast(score >= 80
      ? "Starkes Ergebnis. Eine kurze Wiederholung später festigt es."
      : "Gut. Wiederhole das Thema noch einmal, bevor du es als sicher markierst.");
  }

  renderExamCenter();
}

/* ---------- Lernplan aus Themen ---------- */

function roundToFive(value){
  return Math.max(5,Math.round(value / 5) * 5);
}

/*
 * Ziel: Wichtige und unsichere Themen bekommen mehr Zeit.
 * Mehrere Themen werden verschachtelt gelernt: erst Verstehen für alle,
 * dann Abrufen für alle, danach Anwenden. Das ist abwechslungsreicher und
 * wirkt bei Prüfungen meist besser als ein Thema am Stück.
 */
function autoPlanTopics(examId,silent = false){
  const exam = taskById(examId);
  if (!exam) return null;

  const topics = confirmedTopics(exam);
  if (!topics.length) {
    if (!silent) toast("Bestätige zuerst mindestens ein Prüfungsthema.");
    return null;
  }

  const weights = topics.map(t => {
    const gap = Math.max(.12,1 - topicReadiness(t) / 100);
    return clamp(Number(t.importance) || 3,1,5) * (.45 + gap * 1.55);
  });

  const weightSum = weights.reduce((a,b) => a + b,0) || 1;
  const budget = roundToFive(Math.max(Number(exam.duration) || 240,topics.length * 15));
  exam.duration = budget;

  const alloc = weights.map(w => Math.max(15,roundToFive(budget * w / weightSum)));

  let diff = budget - alloc.reduce((a,b) => a + b,0);
  let guard = 0;
  while (Math.abs(diff) >= 5 && guard < 2000) {
    const i = guard % alloc.length;
    if (diff > 0) {
      alloc[i] += 5;
      diff -= 5;
    } else if (alloc[i] > 15) {
      alloc[i] -= 5;
      diff += 5;
    }
    guard++;
  }

  topics.forEach((t,i) => t.minutes = alloc[i]);

  const plans = topics.map((t,i) => {
    const minutes = alloc[i];
    const count = minutes >= 90 ? 3 : minutes >= 45 ? 2 : 1;
    const names = PHASE_NAMES[count];
    const ratios = PHASE_RATIOS[count];
    let used = 0;

    const blocks = names.map((name,phase) => {
      const duration = phase === count - 1
        ? Math.max(5,minutes - used)
        : roundToFive(minutes * ratios[phase]);
      used += duration;
      return {phase,duration,title:`${name}: ${t.name}`};
    });

    return {topic:t,blocks};
  });

  const generated = [];
  const maxPhases = Math.max(...plans.map(p => p.blocks.length));

  for (let phase = 0; phase < maxPhases; phase++) {
    plans.forEach(p => {
      const block = p.blocks.find(b => b.phase === phase);
      if (!block) return;
      generated.push({
        id:uid(),
        title:block.title,
        duration:block.duration,
        done:false,
        doneAt:null,
        manualDate:false,
        topicId:p.topic.id,
        phase,
        date:iso()
      });
    });
  }

  /* Erledigte und manuell verschobene Schritte bleiben erhalten */
  const kept = (exam.subtasks || []).filter(s => s.done || s.manualDate);
  const keptKeys = new Set(
    kept.filter(s => s.topicId).map(s => `${s.topicId}:${s.phase}`)
  );
  const newSteps = generated.filter(g => !keptKeys.has(`${g.topicId}:${g.phase}`));

  const today = iso();
  const lastDay = exam.due > today ? addDays(exam.due,-1) : today;
  const span = Math.max(0,daysBetween(today,lastDay));

  newSteps.forEach((s,i) => {
    const ratio = newSteps.length <= 1 ? 0 : i / (newSteps.length - 1);
    s.date = addDays(today,Math.round(ratio * span));
  });

  exam.subtasks = [...kept,...newSteps];
  exam.topicPlanUpdatedAt = new Date().toISOString();

  const totalMinutes = newSteps.reduce((sum,s) => sum + s.duration,0);
  const capacity = (span + 1) * Math.round(dailyCapacity() * .8);
  const overloaded = totalMinutes > capacity;

  save();

  if (!silent) {
    renderExamCenter();
    toast(overloaded
      ? `${newSteps.length} Lernblöcke verteilt. Das ist mehr, als dein Tagesziel erlaubt. Beginne früher oder erhöhe das Tagesziel.`
      : `${newSteps.length} Lernblöcke über ${span + 1} Tage verteilt.`);
  }

  return {budget,steps:newSteps.length,overloaded};
}

function startTopicFocus(examId,topicId){
  const exam = taskById(examId);
  const topic = topicsOf(exam || {}).find(t => t.id === topicId);
  if (!exam || !topic) return;

  const step = (exam.subtasks || [])
    .filter(s => s.topicId === topic.id && !s.done)
    .sort((a,b) =>
      String(a.date || "").localeCompare(String(b.date || "")) ||
      (Number(a.phase) || 0) - (Number(b.phase) || 0)
    )[0];

  const minutes = step ? step.duration : topic.minutes;
  const goal = `${subject(exam.subjectId).name}: ${topic.name}`;

  if (prepareFocusTimer(minutes,goal)) goTo("focus");
}

function startTopicStep(examId,stepId){
  const exam = taskById(examId);
  const step = (exam?.subtasks || []).find(s => s.id === stepId);
  if (!exam || !step) return;

  const topic = topicsOf(exam).find(t => t.id === step.topicId);
  const goal = topic ? `${topic.name}: ${step.title}` : step.title;

  if (prepareFocusTimer(step.duration,goal)) goTo("focus");
}

/* ---------- Timer-Steuerung ---------- */

function startTimer(){
  if (timer.running) return;

  const goalInput = $("#focusGoal");
  const phoneInput = $("#phoneAway");

  timer.goal = goalInput?.value.trim() || timer.goal || "Konzentriert arbeiten";
  timer.noPhone = !!phoneInput?.checked;
  timer.running = true;
  timer.end = Date.now() + timer.remaining * 1000;

  persistTimer();
  startTimerInterval();
  renderFocus();
}

function pauseTimer(){
  timer.remaining = timerSecondsRemaining();
  timer.running = false;
  clearInterval(focusInterval);
  persistTimer();
  renderFocus();
}

function resumeTimer(){
  if (timer.running) return;
  timer.running = true;
  timer.end = Date.now() + timer.remaining * 1000;
  persistTimer();
  startTimerInterval();
  renderFocus();
}

function addTimeToTimer(minutes){
  const add = minutes * 60;
  if (timer.running) {
    timer.end += add * 1000;
    timer.original += add;
  } else {
    timer.remaining += add;
    timer.original += add;
  }
  persistTimer();
  updateTimerUI();
  toast(`${minutes} Minuten hinzugefügt.`);
}

function startTimerInterval(){
  clearInterval(focusInterval);
  focusInterval = setInterval(() => {
    if (!timer.running) return;
    timer.remaining = timerSecondsRemaining();
    updateTimerUI();
    if (timer.remaining <= 0) timerFinished();
  },250);
}

function timerFinished(){
  clearInterval(focusInterval);
  beep(3);
  vibrate([200,100,200,100,200]);
  finishTimer(false);
}

function persistTimer(){
  state.meta.activeTimer = {
    running:timer.running,
    remaining:timer.remaining,
    original:timer.original,
    end:timer.end,
    goal:timer.goal,
    noPhone:timer.noPhone,
    distractions:timer.distractions,
    mode:timer.mode
  };
  save();
}

function restoreTimer(){
  const saved = state.meta.activeTimer;
  if (!saved) return;

  timer = {...timer,...saved};

  if (timer.running) {
    timer.remaining = Math.max(0,Math.ceil((timer.end - Date.now()) / 1000));
    if (timer.remaining > 0) {
      startTimerInterval();
    } else {
      timer.running = false;
      timer.remaining = 0;
    }
  }
}

function finishTimer(manual){
  clearInterval(focusInterval);

  const secondsWorked = Math.max(0,timer.original - (timer.running ? timerSecondsRemaining() : timer.remaining));
  const minutes = manual
    ? Math.floor(secondsWorked / 60)
    : Math.round(timer.original / 60);

  if (minutes >= 1) {
    state.sessions.push({
      id:uid(),
      date:iso(),
      minutes,
      goal:timer.goal,
      noPhone:timer.noPhone,
      distractions:timer.distractions,
      mode:timer.mode,
      hour:new Date().getHours(),
      createdAt:new Date().toISOString()
    });
    addXP(Math.max(5,Math.round(minutes / 3)));
  }

  timer.running = false;
  timer.remaining = timer.original;
  timer.distractions = 0;
  timer.goal = "";
  timer.mode = "focus";
  state.meta.activeTimer = null;

  save();
  document.body.classList.remove("focus-mode");
  renderFocus();
  toast(minutes >= 1 ? `${minutes} Fokus-Minuten gespeichert.` : "Timer beendet.");
}

function formatSeconds(seconds){
  const m = Math.floor(seconds / 60);
  const s = Math.max(0,seconds % 60);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function updateTimerUI(){
  const time = $("#timerTime");
  const ring = $("#timerRing");
  const count = $("#distractionCount");

  }
}
